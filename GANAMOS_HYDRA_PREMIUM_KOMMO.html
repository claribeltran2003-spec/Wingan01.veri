<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Inter,Segoe UI,Arial,sans-serif;
background:#030712;
color:#fff;
min-height:100vh;
overflow:hidden;
}
.bg{
position:fixed;inset:0;
background:
radial-gradient(circle at 50% 20%,rgba(37,99,235,.35),transparent 35%),
radial-gradient(circle at 80% 0%,rgba(59,130,246,.20),transparent 30%);
filter:blur(20px);
}
.container{
position:relative;
z-index:2;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:24px;
}
.card{
width:100%;
max-width:480px;
text-align:center;
}
.badge{
display:inline-block;
padding:10px 18px;
border:1px solid rgba(255,255,255,.12);
border-radius:999px;
margin-bottom:22px;
color:#cbd5e1;
backdrop-filter:blur(12px);
}
h1{
font-size:68px;
line-height:.9;
font-weight:900;
margin-bottom:18px;
}
.desc{
color:#94a3b8;
font-size:18px;
margin-bottom:25px;
}
.arrow{
font-size:46px;
color:#60a5fa;
animation:bounce 1.8s infinite;
}
.bonus{
margin-top:24px;
background:linear-gradient(180deg,#111827,#0f172a);
border:1px solid rgba(255,255,255,.08);
border-radius:32px;
padding:34px;
box-shadow:0 0 70px rgba(37,99,235,.22);
}
.percent{
font-size:92px;
font-weight:900;
background:linear-gradient(#93c5fd,#2563eb);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
.btn{
margin-top:26px;
display:inline-flex;
align-items:center;
justify-content:center;
width:100%;
max-width:340px;
padding:18px;
border-radius:999px;
text-decoration:none;
font-weight:800;
font-size:20px;
color:#fff;
background:linear-gradient(135deg,#2563EB,#3B82F6);
box-shadow:0 15px 45px rgba(37,99,235,.4);
}
.trust{margin-top:18px;color:#94a3b8;font-size:13px}
#kommoChatFrame{
position:fixed;inset:0;z-index:9999;
visibility:hidden;opacity:0;
transition:.3s;
background:rgba(0,0,0,.85);
}
#kommoChatFrame.is-open{visibility:visible;opacity:1}
#kommoChatFrame iframe{width:100%!important;height:100%!important;border:0!important}
#kommoClose{
position:fixed;top:15px;right:15px;z-index:10000;
width:44px;height:44px;border:none;border-radius:50%;
background:#111827;color:#fff;display:none;cursor:pointer;
}
#kommoClose.is-open{display:block}
@keyframes bounce{50%{transform:translateY(10px)}}
</style>
</head>
<body>

<div class="bg"></div>

<div class="container">
<div class="card">
<div class="badge">✓ PLATAFORMA SEGURA</div>
<h1>GANÁ<br>MÁS</h1>
<p class="desc">Atención personalizada y activación rápida.</p>
<div class="arrow">↓</div>

<div class="bonus">
<div class="percent">30%</div>
<div style="font-weight:700;letter-spacing:2px">BONO DE BIENVENIDA</div>
</div>

<a href="#" id="botonKommo" class="btn">💬 HABLAR AHORA</a>

<div class="trust">✓ Soporte • ✓ Seguro • ✓ Rápido</div>
</div>
</div>

<div id="kommoChatFrame"></div>
<button id="kommoClose">✕</button>

<script>

id:"1078895",
hash:"7afe8c661ae21b1eb55f38b542603609f977ea292469fbd2b5cb0cf03380b008",
locale:"es"
};
a[o]=a[o]||function(){(a[o].q=a[o].q||[]).push(arguments)};
var d=a.document,s=d.createElement('script');
s.async=true;s.id=mn+'_script';
s.src='https://gso.kommo.com/js/button.js';
d.head.appendChild(s);
}(window,0,'crmPlugin',0,0,'crm_plugin'));
</script>

<script>
(function(){
const frame=document.getElementById('kommoChatFrame');
const closeBtn=document.getElementById('kommoClose');
const btn=document.getElementById('botonKommo');
let ready=false,pending=false;

function openReal(){
frame.classList.add('is-open');
closeBtn.classList.add('is-open');
try{crmPlugin('runChatShow')}catch(e){}
try{
fbq('track','Contact');
fbq('trackCustom','ClickBotonKommo');
}catch(e){}
}
function openChat(e){
e.preventDefault();
if(ready){openReal();return;}
pending=true;
}
function closeChat(){
frame.classList.remove('is-open');
closeBtn.classList.remove('is-open');
try{crmPlugin('runChatHide')}catch(e){}
}
function bind(){
if(typeof crmPlugin!=='function'){setTimeout(bind,100);return;}
crmPlugin('onChatReady',function(){
ready=true;
if(pending){pending=false;openReal();}
});
}
btn.addEventListener('click',openChat);
closeBtn.addEventListener('click',closeChat);
bind();
})();
</script>

</body>
</html>
