<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BETAR | 50% EXTRA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0D2A1F;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 20px;
            text-align: center;
            overflow-x: hidden;
        }

        .container {
            max-width: 420px;
            width: 100%;
        }

        .logo {
            width: 300px;
            max-width: 90%;
            margin: 0 auto 28px;
            display: block;
            filter: drop-shadow(0 6px 16px rgba(0,0,0,0.45));
        }

        .bonus-badge {
            display: inline-block;
            background: linear-gradient(135deg, #F5C518, #E6B800);
            color: #0D2A1F;
            font-weight: 800;
            font-size: 14px;
            padding: 8px 20px;
            border-radius: 50px;
            margin-bottom: 18px;
            letter-spacing: 0.6px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 30px;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 14px;
            color: #ffffff;
        }

        h1 span {
            color: #F5C518;
        }

        .subtitle {
            font-size: 16px;
            color: #C8C8C8;
            margin-bottom: 36px;
            line-height: 1.5;
        }

        .cta-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
            background: linear-gradient(135deg, #25D366, #128C7E);
            color: white;
            font-size: 18px;
            font-weight: 700;
            padding: 18px 24px;
            border-radius: 14px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.35);
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .cta-button:active {
            transform: scale(0.97);
        }

        .cta-button svg {
            width: 26px;
            height: 26px;
            fill: white;
            flex-shrink: 0;
        }

        .secure {
            margin-top: 28px;
            font-size: 13px;
            color: #8A9A90;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .secure svg {
            width: 14px;
            height: 14px;
            fill: #8A9A90;
        }

        @keyframes pulse {
            0% { box-shadow: 0 8px 25px rgba(37, 211, 102, 0.35); }
            50% { box-shadow: 0 8px 32px rgba(37, 211, 102, 0.55); }
            100% { box-shadow: 0 8px 25px rgba(37, 211, 102, 0.35); }
        }

        .cta-button {
            animation: pulse 2.2s infinite;
        }

        /* Ajuste para pantallas muy chicas */
        @media (max-width: 360px) {
            h1 {
                font-size: 26px;
            }
            .logo {
                width: 260px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LOGO BETAR -->
        <!-- Reemplazá la src por la URL de la imagen que descargaste del logo (versión fondo verde o blanca) -->
        <img src="betar-logo.png" alt="BETAR" class="logo">

        <!-- Badge -->
        <div class="bonus-badge">Bono de Bienvenida</div>

        <!-- Título -->
        <h1>Recibí un <span>50% EXTRA</span><br>en tu primer depósito</h1>

        <p class="subtitle">
            Registrate ahora y empezá a jugar con más saldo.<br>
            Atención personalizada por WhatsApp.
        </p>

        <!-- BOTÓN QUE ABRE KOMMO -->
        <button class="cta-button" onclick="openKommoChat()">
            <svg viewBox="0 0 24 24">
                <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.435 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
            </svg>
            Hablar por WhatsApp
        </button>

        <div class="secure">
            <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v8.8z"/></svg>
            Atención 100% segura y privada
        </div>
    </div>

    <script>
        // Abre el chat de Kommo al tocar el botón
        function openKommoChat() {
            if (typeof crmPlugin !== 'undefined') {
                crmPlugin('runChatShow');
            } else if (window.Kommo && typeof window.Kommo.openChat === 'function') {
                window.Kommo.openChat();
            } else {
                // Fallback: reemplazá el número por el tuyo si querés link directo
                // window.open('https://wa.me/549XXXXXXXXXX', '_blank');
                alert('El chat de Kommo aún no está cargado. Pegá el código del botón de chat de Kommo antes del </body>.');
            }
        }
    </script>

    <!-- 
        ============================================
        PEGÁ ACÁ EL CÓDIGO DEL BOTÓN DE CHAT DE KOMMO
        (el que copiás desde Kommo → Ajustes → Botón de chat web / Website chat button)
        ============================================
    -->
</body>
</html>
