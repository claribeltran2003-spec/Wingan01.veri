<style>

/* =========================================================
   RESET
   ========================================================= */

*{

  margin:0;

  padding:0;

  box-sizing:border-box;

}


/* =========================================================
   BODY
   ========================================================= */

html,
body{

  width:100%;

  height:100%;

  overflow:hidden;

  background:#0a0a0a;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  color:#fff;

}


/* =========================================================
   CONTENEDOR CHAT
   ========================================================= */

#kommoChatFrame{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

  background:#0a0a0a;

  visibility:hidden;

  opacity:0;

  transition:
    opacity 0.1s ease,
    visibility 0.1s ease;

  z-index:9999;

}


/* =========================================================
   CHAT ABIERTO
   ========================================================= */

#kommoChatFrame.is-open{

  visibility:visible;

  opacity:1;

}


/* =========================================================
   IFRAME KOMMO
   ========================================================= */

#kommoChatFrame iframe{

  width:100% !important;

  height:100% !important;

  border:0 !important;

}


/* =========================================================
   CARGANDO
   ========================================================= */

#loading{

  position:fixed;

  inset:0;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  gap:14px;

  background:#0a0a0a;

  color:#fff;

  font-size:15px;

  font-weight:600;

  z-index:9998;

}


/* =========================================================
   SPINNER
   ========================================================= */

.spinner{

  width:28px;

  height:28px;

  border:3px solid
    rgba(255,255,255,0.15);

  border-top-color:#25D366;

  border-radius:50%;

  animation:
    spin 0.8s linear infinite;

}


@keyframes spin{

  to{

    transform:rotate(360deg);

  }

}

</style>

<body>


<!-- =========================================================
     CARGANDO CHAT
     ========================================================= -->

<div id="loading">

  <div class="spinner"></div>

  <div>
    Cargando chat...
  </div>

</div>


<!-- =========================================================
     CHATWEB
     ========================================================= -->

<div id="kommoChatFrame"></div>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const frame =
  document.getElementById(
    'kommoChatFrame'
  );


const loading =
  document.getElementById(
    'loading'
  );


let ready = false;


/* =========================================================
   ABRIR CHAT REAL
   ========================================================= */

function openReal(){

  /*
   * Mostrar ChatWeb
   */

  frame.classList.add(
    'is-open'
  );


  /*
   * Ocultar pantalla de carga
   */

  loading.style.display =
    'none';


  /*
   * Abrir Kommo
   */

  try{

    crmPlugin(
      'runChatShow'
    );


    console.log(
      '========================================'
    );

    console.log(
      '✅ CHATWEB BETAR ABIERTO AUTOMÁTICAMENTE'
    );

    console.log(
      '========================================'
    );


  }catch(error){

    console.error(
      '❌ ERROR ABRIENDO CHATWEB BETAR:',
      error
    );

  }

}


/* =========================================================
   ESPERAR CHATWEB KOMMO
   ========================================================= */

function bind(){

  if(
    typeof crmPlugin !==
    'function'
  ){

    setTimeout(
      bind,
      100
    );

    return;

  }


  console.log(
    '⏳ ESPERANDO CHATWEB BETAR...'
  );


  crmPlugin(
    'onChatReady',
    function(){

      ready = true;


      console.log(
        '✅ CHATWEB BETAR LISTO'
      );


      /*
       * ABRIR AUTOMÁTICAMENTE
       */

      openReal();

    }
  );

}


/* =========================================================
   INICIAR
   ========================================================= */

bind();

</script>


</body>
