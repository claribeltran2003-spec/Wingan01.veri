    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>GANAMOS - Bono de Regalo</title>

      style="display:none"

  <!-- =====================================================
       ESTILOS
  ====================================================== -->

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0015;
    }

    .wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .promo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }


    /* =====================================================
       TEXTO
    ====================================================== */

    .cta-text {
      position: absolute;

      left: 50%;
      transform: translateX(-50%);

      bottom: 14%;

      z-index: 50;

      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 14px;
      font-weight: 600;

      text-align: center;

      text-shadow:
        0 2px 8px rgba(0,0,0,0.7);

      width: 90%;

      letter-spacing: 0.2px;
    }


    /* =====================================================
       BOTÓN VERDE
    ====================================================== */

    .wa-btn {
      position: absolute;

      left: 50%;
      transform: translateX(-50%);

      bottom: 5.5%;

      z-index: 50;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      background: #25D366;

      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 17px;
      font-weight: 700;

      padding: 15px 28px;

      border-radius: 50px;

      border: none;

      cursor: pointer;

      box-shadow:
        0 8px 24px rgba(37, 211, 102, 0.55);

      width: 78%;
      max-width: 300px;

      -webkit-tap-highlight-color: transparent;

      animation:
        pulse 1.6s ease-in-out infinite;
    }


    .wa-btn:active {
      transform:
        translateX(-50%)
        scale(0.97);
    }


    .wa-btn img {
      width: 26px;
      height: 26px;

      display: block;

      flex-shrink: 0;
    }


    /* =====================================================
       ANIMACIÓN
    ====================================================== */

    @keyframes pulse {

      0% {
        transform:
          translateX(-50%)
          scale(1);

        box-shadow:
          0 8px 24px rgba(37, 211, 102, 0.45);
      }

      50% {
        transform:
          translateX(-50%)
          scale(1.06);

        box-shadow:
          0 12px 32px rgba(37, 211, 102, 0.75);
      }

      100% {
        transform:
          translateX(-50%)
          scale(1);

        box-shadow:
          0 8px 24px rgba(37, 211, 102, 0.45);
      }

    }


    /* =====================================================
       OCULTAR BOTÓN ORIGINAL DE KOMMO
       
       IMPORTANTE:
       NO usamos display:none.
       NO usamos z-index:-1.
       Lo dejamos funcionando pero invisible.
    ====================================================== */

    #crm_plugin_button {
      opacity: 0 !important;

      visibility: hidden !important;

      position: fixed !important;

      right: 20px !important;
      bottom: 20px !important;

      width: 1px !important;
      height: 1px !important;

      pointer-events: none !important;

      z-index: 1 !important;
    }

  </style>

</head>


<body>


  <!-- =====================================================
       LANDING
  ====================================================== -->

  <div class="wrapper">

    <img
      src="promo.jpeg"
      alt="Bono de Regalo"
      class="promo"
    >


    <p class="cta-text">
      Tocá el botón para hablar por WhatsApp
    </p>


    <button
      class="wa-btn"
      id="btnChat"
      type="button"
    >

      <img
        src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
        alt="WhatsApp"
      >

      Escribime acá!

    </button>

  </div>


  <!-- =====================================================
       KOMMO
       
       SIN hidden:true.
       Dejamos que Kommo cargue normalmente.
    ====================================================== -->
<!-- =====================================================
     KOMMO
====================================================== -->

<!-- =====================================================
     OCULTAR ÚNICAMENTE EL BOTÓN FLOTANTE DE KOMMO
     
     NO eliminamos Kommo.
     NO desactivamos el chat.
====================================================== -->

<style>

  #crm_plugin_button {
    position: fixed !important;

    right: -200px !important;
    bottom: -200px !important;

    opacity: 0 !important;

    width: 1px !important;
    height: 1px !important;

    z-index: -1 !important;

    pointer-events: auto !important;
  }

</style>


<script>

  /*
   * Kommo se crea dinámicamente.
   * Por eso observamos el DOM y ocultamos
   * solamente su botón cuando aparece.
   */

  function ocultarBotonKommo() {

    var boton = document.getElementById('crm_plugin_button');

    if (boton) {

      boton.style.setProperty(
        'position',
        'fixed',
        'important'
      );

      boton.style.setProperty(
        'right',
        '-200px',
        'important'
      );

      boton.style.setProperty(
        'bottom',
        '-200px',
        'important'
      );

      boton.style.setProperty(
        'opacity',
        '0',
        'important'
      );

      boton.style.setProperty(
        'width',
        '1px',
        'important'
      );

      boton.style.setProperty(
        'height',
        '1px',
        'important'
      );

      boton.style.setProperty(
        'z-index',
        '-1',
        'important'
      );

    }
  }


  /*
   * Intentos iniciales
   */

  ocultarBotonKommo();

  setTimeout(ocultarBotonKommo, 300);
  setTimeout(ocultarBotonKommo, 800);
  setTimeout(ocultarBotonKommo, 1500);
  setTimeout(ocultarBotonKommo, 3000);


  /*
   * Si Kommo vuelve a crear/modificar el botón,
   * lo volvemos a ocultar.
   */

  var observerKommo = new MutationObserver(function(){

    ocultarBotonKommo();

  });


  observerKommo.observe(
    document.body,
    {
      childList: true,
      subtree: true
    }
  );

</script>


<!-- =====================================================
     BOTÓN VERDE → ABRIR CHAT DE KOMMO
====================================================== -->

<script>

  document
    .getElementById('btnChat')
    .addEventListener('click', function(e){

      e.preventDefault();
      e.stopPropagation();


      /*
       * META PIXEL
       */

      if (typeof fbq === 'function') {

        fbq('track', 'Contact');

      }


      /*
       * ABRIR KOMMO
       */

      if (typeof crmPlugin === 'function') {

        crmPlugin('runChatShow');

      }


      /*
       * Como respaldo, intentamos también
       * hacer click en el botón real de Kommo.
       */

      setTimeout(function(){

        var boton =
          document.getElementById('crm_plugin_button');

        if (boton) {

          try {
            boton.click();
          } catch(e) {}

        }

      }, 200);

    });

</script>

  <!-- =====================================================
       CONTROL DEL CHAT
  ====================================================== -->

  <script>

    var kommoReady = false;


    /*
     * Kommo avisa cuando el chat está completamente
     * inicializado.
     */

    crmPlugin(
      'onChatReady',
      function(){

        kommoReady = true;

        console.log('KOMMO: chat listo');

      }
    );


    /*
     * Función para abrir Kommo.
     */

    function abrirKommo() {

      console.log('KOMMO: intentando abrir');


      /*
       * MÉTODO 1:
       * API oficial de Kommo.
       */

      if(typeof crmPlugin === 'function') {

        console.log('KOMMO: ejecutando runChatShow');

        crmPlugin('runChatShow');

      }


      /*
       * MÉTODO 2:
       * Si existe el botón real de Kommo,
       * también simulamos el click.
       *
       * Esto sirve como respaldo.
       */

      setTimeout(function(){

        var kommoButton =
          document.getElementById('crm_plugin_button');


        if(kommoButton){

          console.log('KOMMO: botón encontrado');

          try {

            kommoButton.click();

          } catch(error) {

            console.log(
              'KOMMO: error al hacer click',
              error
            );

          }

        } else {

          console.log(
            'KOMMO: botón todavía no encontrado'
          );

        }

      }, 100);


      /*
       * Segundo intento de apertura.
       */

      setTimeout(function(){

        if(typeof crmPlugin === 'function'){

          crmPlugin('runChatShow');

        }

      }, 500);

    }


    /*
     * BOTÓN VERDE
     */

    document
      .getElementById('btnChat')
      .addEventListener(
        'click',
        function(e){

          e.preventDefault();

          e.stopPropagation();


          /*
           * Meta Contact
           */

          if(typeof fbq === 'function'){

            fbq('track', 'Contact');

          }


          /*
           * Abrir Kommo
           */

          abrirKommo();

        }
      );


  </script>


</body>
</html>
