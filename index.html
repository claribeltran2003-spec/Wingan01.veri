<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ff5a1f">
<title>Kings Ganamos CHAT</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#080202;
color:#fff;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
background:
radial-gradient(circle at 50% 25%,rgba(255,90,31,.12),transparent 35%),
radial-gradient(circle at 50% 70%,rgba(255,90,31,.20),transparent 40%),
radial-gradient(circle at 15% 50%,rgba(255,90,31,.08),transparent 30%),
radial-gradient(circle at 85% 50%,rgba(255,90,31,.08),transparent 30%);
pointer-events:none;
}

.container{
max-width:480px;
margin:auto;
padding:70px 28px 120px;
min-height:100vh;
}

.header{
display:flex;
align-items:center;
gap:12px;
margin-bottom:70px;
}

.logo{
width:60px;
height:60px;
border-radius:16px;
background:#ff5a1f;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
font-weight:900;
color:#000;
}

.brand{
font-size:34px;
font-weight:800;
}

.badge{
margin-left:auto;
padding:10px 14px;
border:1px solid rgba(255,255,255,.15);
border-radius:999px;
font-size:11px;
letter-spacing:2px;
color:#d4d4d4;
}

.online{
margin-bottom:60px;
font-size:12px;
letter-spacing:5px;
color:#a3a3a3;
}

h1{
font-size:54px;
line-height:1;
font-weight:900;
margin-bottom:50px;
}

.desc{
text-align:center;
color:#ff6b35;
font-size:16px;
letter-spacing:5px;
line-height:1.8;
margin-bottom:50px;
}

.arrow{
text-align:center;
font-size:56px;
color:#ff5a1f;
margin-bottom:55px;
}

.bonus{
position:relative;
cursor:pointer;
border:2px solid #ff5a1f;
border-radius:34px;
padding:50px 24px;
text-align:center;
box-shadow:0 0 25px rgba(255,90,31,.25),0 0 60px rgba(255,90,31,.15);
animation:pulseGlow 2.5s infinite;
transition:.25s;
}

.bonus::before{
content:"";
position:absolute;
inset:-40px;
background:radial-gradient(circle,rgba(255,90,31,.20),transparent 70%);
z-index:-1;
}

.bonus:hover{
transform:translateY(-4px);
}

.percent{
font-size:96px;
font-weight:900;
color:#ff5a1f;
}

.btext{
margin-top:12px;
font-size:18px;
letter-spacing:4px;
line-height:1.8;
}

@keyframes pulseGlow{
0%{
transform:scale(1);
box-shadow:0 0 25px rgba(255,90,31,.25),0 0 60px rgba(255,90,31,.15);
}
50%{
transform:scale(1.02);
box-shadow:0 0 40px rgba(255,90,31,.45),0 0 120px rgba(255,90,31,.30);
}
100%{
transform:scale(1);
box-shadow:0 0 25px rgba(255,90,31,.25),0 0 60px rgba(255,90,31,.15);
}
}

#kommoChatFrame{
position:fixed;
inset:0;
visibility:hidden;
opacity:0;
transition:.3s;
background:rgba(0,0,0,.92);
z-index:9999;
}

#kommoChatFrame.is-open{
visibility:visible;
opacity:1;
}

#kommoChatFrame iframe{
width:100%!important;
height:100%!important;
border:0!important;
}

@media(max-width:480px){
h1{font-size:48px}
.percent{font-size:84px}
}
</style>

<script>
window.crmPluginConfig={
hidden:true,
color:'#ff5a1f',
onlinechat:{
mode:'frame',
container:'#kommoChatFrame',
locale:{extends:'es'}
}
};
</script>
</head>

<body>

<div class="container">

<div class="header">
<div class="logo">G</div>
<div class="brand">KINGS</div>
<div class="badge">PLATAFORMA GANAMOS</div>
</div>

<div class="online">● OPERADORES EN LÍNEA AHORA</div>

<h1>Cargá y jugá<br>en minutos</h1>

<div class="desc">
HACÉ CLICK AQUÍ Y TE<br>
CREAMOS TU CUENTA
</div>

<div class="arrow">↓</div>

<div class="bonus" id="bonusKommo">
<div class="percent">30%</div>
<div class="btext">EXTRA DE BONO EN TU<br>PRIMER DEPÓSITO</div>
</div>

</div>

<div id="kommoChatFrame"></div>

<script>
(function(a,m,o,c,r,mn){
a[mn]={
id:"1078895",
hash:"7afe8c661ae21b1eb55f38b542603609f977ea292469fbd2b5cb0cf03380b008",
locale:"es"
};
a[o]=a[o]||function(){(a[o].q=a[o].q||[]).push(arguments)};
var d=a.document,s=d.createElement('script');
s.async=true;
s.src='https://gso.kommo.com/js/button.js';
d.head.appendChild(s);
}(window,0,'crmPlugin',0,0,'crm_plugin'));

const frame=document.getElementById('kommoChatFrame');
const bonus=document.getElementById('bonusKommo');

let ready=false,pending=false;

function openKommo(){
if(ready){
frame.classList.add('is-open');
try{crmPlugin('runChatShow')}catch(e){}
}else{
pending=true;
}
}

function bindKommo(){
if(typeof crmPlugin!=='function'){
setTimeout(bindKommo,100);
return;
}

crmPlugin('onChatReady',function(){
ready=true;
if(pending){
pending=false;
openKommo();
}
});
}

bonus.addEventListener('click',openKommo);
bindKommo();
</script>

</body>
</html>
