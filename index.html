<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>GANAMOS - Bono de Regalo</title>


  <!-- =====================================================
       META PIXEL
  ====================================================== -->

  <script>
    !function(f,b,e,v,n,t,s)
    {
      if(f.fbq)return;

      n=f.fbq=function(){
        n.callMethod ?
        n.callMethod.apply(n,arguments) :
        n.queue.push(arguments)
      };

      if(!f._fbq)f._fbq=n;

      n.push=n;
      n.loaded=!0;
      n.version='2.0';
      n.queue=[];

      t=b.createElement(e);
      t.async=!0;
      t.src=v;

      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s);

    }(
      window,
      document,
      'script',
      'https://connect.facebook.net/en_US/fbevents.js'
    );

    fbq('init', '1993981097970015');
    fbq('track', 'PageView');
  </script>


  <noscript>

    <img
      height="1"
      width="1"
      style="display:none"
      src="https://www.facebook.com/tr?id=1993981097970015&ev=PageView&noscript=1"
    >

  </noscript>


  <!-- =====================================================
       KOMMO CONFIG
  ====================================================== -->

  <script>

    window.crmPluginConfig = {

      hidden: true,

      onlinechat: {

        mode: "widget",

        locale: {
          extends: "es"
        }

      }

    };

  </script>


  <!-- =====================================================
       KOMMO SCRIPT
  ====================================================== -->

  <script
    async
    id="crm_plugin_script"
    src="https://gso.kommo.com/js/button.js">
  </script>


  <!-- =====================================================
       CSS KOMMO
  ====================================================== -->

  <link
    rel="stylesheet"
    href="https://gso.kommo.com/build/css/index.css?f4Z6G1mL4LI9f_2kboV0x"
  >


  <!-- =====================================================
       ESTILOS
  ====================================================== -->

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #0a0015;

    }


    .wrapper {

      position: relative;

      width: 100%;
      height: 100%;

      max-width: 480px;

      margin: 0 auto;

    }


    .promo {

      width: 100%;
      height: 100%;

      display: block;

      object-fit: cover;

      object-position: center top;

    }


    .cta-text {

      position: absolute;

      left: 50%;

      bottom: 14%;

      transform:
        translateX(-50%);

      width: 90%;

      z-index: 100;

      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      font-size: 14px;

      font-weight: 600;

      text-align: center;

      text-shadow:
        0 2px 8px rgba(0,0,0,.7);

    }


    /* =====================================================
       BOTÓN VERDE
    ====================================================== */

    #botonKommo {

      position: absolute;

      left: 50%;

      bottom: 5.5%;

      transform:
        translateX(-50%);

      z-index: 10000;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      width: 78%;

      max-width: 300px;

      padding: 15px 28px;

      background: #25D366;

      color: #fff;

      text-decoration: none;

      border-radius: 50px;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      font-size: 17px;

      font-weight: 700;

      box-shadow:
        0 8px 24px
        rgba(37,211,102,.55);

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

    }


    #botonKommo img {

      width: 26px;
      height: 26px;

      display: block;

    }


    /* =====================================================
       OCULTAR BOTÓN FLOTANTE KOMMO
    ====================================================== */

    .amo-button-holder,
    .amo-button-holder.amo-horisontal {

      display: none !important;

      visibility: hidden !important;

      opacity: 0 !important;

      pointer-events: none !important;

    }


    /* =====================================================
       CHAT DE KOMMO
    ====================================================== */

    #kommoChatFrame {

      position: fixed !important;

      inset: 0 !important;

      width: 100vw !important;

      height: 100vh !important;

      z-index: 99999 !important;

      display: none;

      pointer-events: none;

    }


    #kommoChatFrame.is-open {

      display: block !important;

      pointer-events: auto;

    }


    #amo-livechat {

      width: 100% !important;

      height: 100% !important;

    }


    #amo-livechat iframe {

      width: 100% !important;

      height: 100% !important;

      border: 0 !important;

    }


    /* =====================================================
       CERRAR
    ====================================================== */

    #kommoClose {

      position: fixed;

      top: 12px;

      right: 12px;

      z-index: 100001;

      width: 42px;

      height: 42px;

      border: 0;

      border-radius: 50%;

      background:
        rgba(0,0,0,.65);

      color: white;

      display: none;

      align-items: center;

      justify-content: center;

      cursor: pointer;

    }


    #kommoClose.is-open {

      display: flex;

    }

  </style>

</head>


<body>


  <div class="wrapper">

    <img
      src="promo.jpeg"
      class="promo"
      alt="Bono de Regalo"
    >


    <p class="cta-text">
      Tocá el botón para hablar por WhatsApp
    </p>


    <a
      href="#"
      id="botonKommo"
    >

      <img
        src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
        alt="WhatsApp"
      >

      <span>
        Escribime acá!
      </span>

    </a>

  </div>


  <!-- =====================================================
       CONTENEDOR DEL CHAT
  ====================================================== -->

  <div
    id="kommoChatFrame"
    aria-hidden="true"
  ></div>


  <button
    id="kommoClose"
    type="button"
    aria-label="Cerrar chat"
  >

    <svg
      width="24"
      height="24"
      viewBox="0 0 24 24"
      fill="none"
    >

      <path
        d="M6 6L18 18M18 6L6 18"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />

    </svg>

  </button>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script>

    (function () {


      const button =
        document.getElementById(
          'botonKommo'
        );


      const frame =
        document.getElementById(
          'kommoChatFrame'
        );


      const close =
        document.getElementById(
          'kommoClose'
        );


      /*
       * Busca el iframe que Kommo
       * haya creado automáticamente.
       */

      function findKommoChat() {

        return document.querySelector(
          '#amo-livechat'
        );

      }


      /*
       * Mueve el chat generado por Kommo
       * dentro de nuestro contenedor.
       */

      function prepareChat() {

        const chat =
          findKommoChat();


        if (!chat)
          return false;


        if (
          chat.parentElement !==
          frame
        ) {

          frame.appendChild(
            chat
          );

        }


        return true;

      }


      /*
       * Detectar cuando button.js
       * termina de crear el chat.
       */

      const observer =
        new MutationObserver(
          function () {

            prepareChat();

          }
        );


      observer.observe(
        document.body,
        {
          childList: true,
          subtree: true
        }
      );


      /*
       * BOTÓN
       */

      button.addEventListener(
        'click',
        function (e) {

          e.preventDefault();


          /*
           * Meta
           */

          if (
            typeof fbq ===
            'function'
          ) {

            fbq(
              'track',
              'Contact'
            );

            fbq(
              'trackCustom',
              'ClickBotonKommo'
            );

          }


          /*
           * Primero intentamos preparar
           * el widget generado por Kommo.
           */

          prepareChat();


          /*
           * Intentar API oficial.
           */

          try {

            if (
              typeof crmPlugin ===
              'function'
            ) {

              crmPlugin(
                'runChatShow'
              );

            }

          } catch (_) {}


          /*
           * Mostrar nuestro contenedor
           * si Kommo ya creó el iframe.
           */

          setTimeout(
            function () {

              if (
                prepareChat()
              ) {

                frame.classList.add(
                  'is-open'
                );

                frame.setAttribute(
                  'aria-hidden',
                  'false'
                );

                close.classList.add(
                  'is-open'
                );

              }

            },
            300
          );

        }
      );


      /*
       * CERRAR
       */

      close.addEventListener(
        'click',
        function () {

          frame.classList.remove(
            'is-open'
          );

          frame.setAttribute(
            'aria-hidden',
            'true'
          );

          close.classList.remove(
            'is-open'
          );


          try {

            if (
              typeof crmPlugin ===
              'function'
            ) {

              crmPlugin(
                'runChatHide'
              );

            }

          } catch (_) {}

        }
      );


    })();

  </script>

</body>

</html>
