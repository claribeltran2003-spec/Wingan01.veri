<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atención al Cliente</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: #f0f2f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body>

  <!-- Código del widget de Kommo -->
  <script>
    (function(a,m,o,c,r,m){
      a[m]={
        id:"1078895",
        hash:"7afe8c661ae21b1eb55f38b542603609f977ea292469fbd2b5cb0cf03380b008",
        locale:"es",
        setMeta:function(p){this.params=(this.params||[]).concat([p])}
      };
      a[o]=a[o]||function(){(a[o].q=a[o].q||[]).push(arguments)};
      var d=a.document,s=d.createElement('script');
      s.async=true;
      s.id=m+'_script';
      s.src='https://gso.kommo.com/js/button.js';
      d.head&&d.head.appendChild(s)
    }(window,0,'crmPlugin',0,0,'crm_plugin'));
  </script>

  <!-- Forzar apertura automática del chat (versión más fuerte) -->
  <script>
    function openChat() {
      try {
        if (typeof crmPlugin === 'function') {
          crmPlugin('runChatShow');
          return true;
        }
      } catch (e) {}
      return false;
    }

    // Intentar varias veces hasta que abra
    let attempts = 0;
    const maxAttempts = 15;

    const interval = setInterval(function() {
      attempts++;
      if (openChat() || attempts >= maxAttempts) {
        clearInterval(interval);
      }
    }, 400);

    // También intentar cuando la página termine de cargar
    window.addEventListener('load', function() {
      setTimeout(openChat, 300);
      setTimeout(openChat, 800);
      setTimeout(openChat, 1500);
    });
  </script>

</body>
</html>
