/* =====================================================
   BOTÓN VERDE
====================================================== */

.wa-btn {

  position: absolute;

  left: 50%;

  transform:
    translateX(-50%);

  bottom: 5.5%;

  z-index: 50;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 10px;

  width: 78%;

  max-width: 300px;

  padding: 15px 28px;

  background: #25D366;

  color: #fff;

  text-decoration: none;

  border: none;

  border-radius: 50px;

  cursor: pointer;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  font-size: 17px;

  font-weight: 700;

  box-shadow:
    0 8px 24px
    rgba(37,211,102,.55);

  -webkit-tap-highlight-color:
    transparent;

  animation:
    pulse 1.6s
    ease-in-out
    infinite;

}


.wa-btn:active {

  transform:
    translateX(-50%)
    scale(.97);

}


.wa-btn img {

  width: 26px;

  height: 26px;

  display: block;

  flex-shrink: 0;

}


/* =====================================================
   LOADING
====================================================== */

.btn-loading {

  display: none;

  align-items: center;

  gap: 10px;

}


.wa-btn.is-loading
.btn-label {

  display: none;

}


.wa-btn.is-loading
.btn-loading {

  display: inline-flex;

}


.btn-spinner {

  width: 18px;

  height: 18px;

  border-radius: 50%;

  border: 2px solid
    rgba(255,255,255,.45);

  border-top-color:
    currentColor;

  animation:
    btnSpin .8s
    linear infinite;

}


@keyframes btnSpin {

  to {

    transform:
      rotate(360deg);

  }

}


/* =====================================================
   ANIMACIÓN
====================================================== */

@keyframes pulse {

  0% {

    transform:
      translateX(-50%)
      scale(1);

    box-shadow:
      0 8px 24px
      rgba(37,211,102,.45);

  }

  50% {

    transform:
      translateX(-50%)
      scale(1.06);

    box-shadow:
      0 12px 32px
      rgba(37,211,102,.75);

  }

  100% {

    transform:
      translateX(-50%)
      scale(1);

    box-shadow:
      0 8px 24px
      rgba(37,211,102,.45);

  }

}

<!-- =====================================================
     CONTROL
====================================================== -->

<script>

(function() {


  const frame =
    document.getElementById(
      'kommoChatFrame'
    );


  const closeBtn =
    document.getElementById(
      'kommoClose'
    );


  const kommoBtn =
    document.getElementById(
      'botonKommo'
    );


  let chatReady =
    false;


  let pendingOpen =
    false;


  /* ===================================================
     LOADING
  ==================================================== */

  function setBtnLoading(
    isLoading
  ) {

    if (!kommoBtn)
      return;


    kommoBtn.classList.toggle(
      'is-loading',
      !!isLoading
    );


    kommoBtn.style.pointerEvents =
      isLoading
        ? 'none'
        : '';


    kommoBtn.style.opacity =
      isLoading
        ? '0.75'
        : '';

  }


  /* ===================================================
     ABRIR
  ==================================================== */

  function doOpen() {

    setBtnLoading(false);


    /*
     * NO mostramos ningún overlay.
     *
     * Kommo se encarga de mostrar
     * su propio iframe.
     */

    try {

      if (
        typeof crmPlugin ===
        'function'
      ) {

        crmPlugin(
          'runChatShow'
        );

      }

    } catch (_) {}


    /*
     * META
     */

    if (
      typeof fbq ===
      'function'
    ) {


      /*
       * Clic de contacto
       */

      fbq(
        'track',
        'Contact'
      );


      /*
       * Evento personalizado
       */

      fbq(
        'trackCustom',
        'ClickBotonKommo'
      );


      /*
       * PURCHASE
       *
       * Cada clic será reportado
       * como una conversión Purchase.
       */

      fbq(
        'track',
        'Purchase',
        {
          value: 1.00,
          currency: 'USD'
        }
      );

    }

  }


  /* ===================================================
     CLICK
  ==================================================== */

  function openChat(ev) {

    if (ev)
      ev.preventDefault();


    /*
     * Si todavía no está listo
     */

    if (!chatReady) {

      pendingOpen =
        true;

      setBtnLoading(
        true
      );

      return;

    }


    doOpen();

  }


  /* ===================================================
     CERRAR
  ==================================================== */

  function closeChat() {


    try {

      if (
        typeof crmPlugin ===
        'function'
      ) {

        crmPlugin(
          'runChatHide'
        );

      }

    } catch (_) {}


    if (closeBtn) {

      closeBtn.classList.remove(
        'is-open'
      );

    }

  }


  /* ===================================================
     ESPERAR A KOMMO
  ==================================================== */

  function bindKommo() {

    if (
      typeof crmPlugin !==
      'function'
    ) {

      setTimeout(
        bindKommo,
        100
      );

      return;

    }


    /*
     * LISTO
     */

    crmPlugin(
      'onChatReady',
      function() {

        chatReady =
          true;


        setBtnLoading(
          false
        );


        if (
          pendingOpen
        ) {

          pendingOpen =
            false;


          doOpen();

        }

      }
    );


    /*
     * MOSTRÓ
     */

    crmPlugin(
      'onChatShow',
      function() {

        if (closeBtn) {

          closeBtn.classList.add(
            'is-open'
          );

        }

      }
    );


    /*
     * OCULTÓ
     */

    crmPlugin(
      'onChatHide',
      function() {

        if (closeBtn) {

          closeBtn.classList.remove(
            'is-open'
          );

        }

      }
    );

  }


  /* ===================================================
     EVENTOS
  ==================================================== */

  if (kommoBtn) {

    kommoBtn.addEventListener(
      'click',
      openChat
    );

  }


  if (closeBtn) {

    closeBtn.addEventListener(
      'click',
      closeChat
    );

  }


  document.addEventListener(
    'keydown',
    function(ev) {

      if (
        ev.key === 'Escape'
      ) {

        closeChat();

      }

    }
  );


  /* ===================================================
     START
  ==================================================== */

  setBtnLoading(false);

  bindKommo();


})();

</script>
