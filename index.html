<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GANAMOS - Bono de Regalo</title>

  <!-- Facebook Pixel -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1993981097970015');
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1993981097970015&ev=PageView&noscript=1"/>
  </noscript>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0015;
    }

    .wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .promo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* Botón verde WhatsApp visible */
    .wa-btn {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 6%;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #25D366;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      font-weight: 700;
      padding: 15px 28px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.55);
      width: 78%;
      max-width: 300px;
      -webkit-tap-highlight-color: transparent;
    }

    .wa-btn:active {
      transform: translateX(-50%) scale(0.97);
    }

    .wa-btn img {
      width: 26px;
      height: 26px;
      display: block;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <img src="promo.jpeg" alt="Bono de Regalo" class="promo">

    <!-- Único botón visible: WhatsApp verde -->
    <button class="wa-btn" id="btnChat" type="button">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" width="26" height="26">
      Escribime acá!
    </button>
  </div>

  <!-- Kommo (el botón flotante se mueve fuera de pantalla) -->
  <script>
    (function(a,m,o,c,r,m){
      a[m]={
        id:"1078895",
        hash:"7afe8c661ae21b1eb55f38b542603609f977ea292469fbd2b5cb0cf03380b008",
        locale:"es",
        setMeta:function(p){this.params=(this.params||[]).concat([p])}
      };
      a[o]=a[o]||function(){(a[o].q=a[o].q||[]).push(arguments)};
      var d=a.document,s=d.createElement('script');
      s.async=true;
      s.id=m+'_script';
      s.src='https://gso.kommo.com/js/button.js';
      d.head&&d.head.appendChild(s)
    }(window,0,'crmPlugin',0,0,'crm_plugin'));
  </script>

  <script>
    // Pixel Contact
    setTimeout(function() {
      if (typeof fbq === 'function') fbq('track', 'Contact');
    }, 2500);

    // Mover el botón flotante de Kommo FUERA de la pantalla (no se borra)
    function hideKommoButton() {
      var btn = document.getElementById('crm_plugin_button');
      if (btn) {
        btn.style.cssText = 'position:fixed!important;bottom:-300px!important;right:-300px!important;left:auto!important;top:auto!important;opacity:0!important;z-index:-1!important;pointer-events:auto!important;';
      }
    }

    // Ejecutar varias veces porque Kommo carga tarde
    setInterval(hideKommoButton, 400);
    setTimeout(hideKommoButton, 600);
    setTimeout(hideKommoButton, 1500);
    setTimeout(hideKommoButton, 3000);

    function openChat() {
      // 1. Método oficial de Kommo
      try {
        if (typeof crmPlugin === 'function') {
          crmPlugin('runChatShow');
        }
      } catch (e) {}

      // 2. Clic real al botón oculto
      var btn = document.getElementById('crm_plugin_button');
      if (btn) {
        try { btn.click(); } catch (e) {}
      }

      // 3. Reintentos
      setTimeout(function() {
        try { if (typeof crmPlugin === 'function') crmPlugin('runChatShow'); } catch (e) {}
        if (btn) try { btn.click(); } catch (e) {}
      }, 400);

      setTimeout(function() {
        try { if (typeof crmPlugin === 'function') crmPlugin('runChatShow'); } catch (e) {}
      }, 1000);
    }

    document.getElementById('btnChat').addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      openChat();
    });
  </script>

</body>
</html>
