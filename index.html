  <!-- =====================================================
       KOMMO CONFIG
  ====================================================== -->

  <script>

    window.crmPluginConfig = {

      hidden: true,

      onlinechat: {

        mode: "widget",

        locale: {
          extends: "es"
        }

      }

    };

  </script>


  <!-- =====================================================
       KOMMO SCRIPT
  ====================================================== -->

  <script
    async
    id="crm_plugin_script"
    src="https://gso.kommo.com/js/button.js">
  </script>


  <!-- =====================================================
       CSS OFICIAL KOMMO
       MISMA CONFIGURACIÓN DE LA LANDING DE REFERENCIA
  ====================================================== -->

  <link
    rel="stylesheet"
    href="https://gso.kommo.com/build/css/index.css?f4Z6G1mL4LI9f_2kboV0x"
  >


  <!-- =====================================================
       ESTILOS DE LA LANDING
  ====================================================== -->

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #0a0015;

    }


    .wrapper {

      position: relative;

      width: 100%;
      height: 100%;

      max-width: 480px;

      margin: 0 auto;

    }


    .promo {

      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position: center top;

      display: block;

    }


    /* =====================================================
       TEXTO
    ====================================================== */

    .cta-text {

      position: absolute;

      left: 50%;

      transform:
        translateX(-50%);

      bottom: 14%;

      z-index: 50;

      width: 90%;

      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 14px;

      font-weight: 600;

      text-align: center;

      letter-spacing: .2px;

      text-shadow:
        0 2px 8px rgba(0,0,0,.7);

    }


    /* =====================================================
       BOTÓN VERDE
    ====================================================== */

    .cta-btn {

      position: absolute;

      left: 50%;

      transform:
        translateX(-50%);

      bottom: 5.5%;

      z-index: 50;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      width: 78%;

      max-width: 300px;

      padding: 15px 28px;

      background: #25D366;

      color: #fff;

      text-decoration: none;

      border: none;

      border-radius: 50px;

      cursor: pointer;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 17px;

      font-weight: 700;

      box-shadow:
        0 8px 24px
        rgba(37,211,102,.55);

      -webkit-tap-highlight-color:
        transparent;

      animation:
        pulse 1.6s ease-in-out infinite;

    }


    .cta-btn:active {

      transform:
        translateX(-50%)
        scale(.97);

    }


    .cta-btn img {

      width: 26px;

      height: 26px;

      display: block;

      flex-shrink: 0;

    }


    /* =====================================================
       LOADING
    ====================================================== */

    .cta-btn .btn-label {

      display: inline;

    }


    .cta-btn .btn-loading {

      display: none;

      align-items: center;

      gap: 10px;

    }


    .cta-btn.is-loading .btn-label {

      display: none;

    }


    .cta-btn.is-loading .btn-loading {

      display: inline-flex;

    }


    .btn-spinner {

      width: 18px;

      height: 18px;

      border-radius: 50%;

      border: 2px solid
        rgba(255,255,255,.45);

      border-top-color:
        currentColor;

      animation:
        btnSpin .8s linear infinite;

    }


    @keyframes btnSpin {

      to {
        transform: rotate(360deg);
      }

    }


    /* =====================================================
       ANIMACIÓN BOTÓN
    ====================================================== */

    @keyframes pulse {

      0% {

        transform:
          translateX(-50%)
          scale(1);

        box-shadow:
          0 8px 24px
          rgba(37,211,102,.45);

      }

      50% {

        transform:
          translateX(-50%)
          scale(1.06);

        box-shadow:
          0 12px 32px
          rgba(37,211,102,.75);

      }

      100% {

        transform:
          translateX(-50%)
          scale(1);

        box-shadow:
          0 8px 24px
          rgba(37,211,102,.45);

      }

    }


    /* =====================================================
       KOMMO CHAT FRAME
       
       IMPORTANTE:
       NO hacemos fixed, width 100vw ni height 100vh.
       Kommo controla su propio iframe.
    ====================================================== */

    #kommoChatFrame {

      position: relative;

    }


    /* =====================================================
       BOTÓN CERRAR
    ====================================================== */

    #kommoClose {

      position: fixed;

      top: 12px;

      right: 12px;

      z-index: 100002;

      width: 42px;

      height: 42px;

      border: none;

      border-radius: 50%;

      background:
        rgba(0,0,0,.6);

      color: #fff;

      font-size: 28px;

      line-height: 42px;

      text-align: center;

      cursor: pointer;

      display: none;

    }


    #kommoClose.is-open {

      display: block;

    }


    /* =====================================================
       OCULTAR BOTÓN FLOTANTE NATIVO DE KOMMO
    ====================================================== */

    .amo-button-holder {

      display: none !important;

      visibility: hidden !important;

      opacity: 0 !important;

      pointer-events: none !important;

    }

  </style>

</head>


<body>


  <!-- =====================================================
       LANDING
  ====================================================== -->

  <div class="wrapper">


    <img
      src="promo.jpeg"
      alt="Bono de Regalo"
      class="promo"
    >


    <p class="cta-text">
      Tocá el botón para hablar por WhatsApp
    </p>


    <!-- ===================================================
         BOTÓN VERDE
    ==================================================== -->

    <a
      href="#"
      class="cta-btn anim-shake"
      id="botonKommo"
    >

      <img
        src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
        alt="WhatsApp"
      >


      <span class="btn-label">
        Escribime acá!
      </span>


      <span
        class="btn-loading"
        aria-live="polite"
      >

        <span
          class="btn-spinner"
          aria-hidden="true"
        ></span>

        <span>
          Cargando chat...
        </span>

      </span>

    </a>

  </div>


  <!-- =====================================================
       KOMMO CHAT FRAME
  ====================================================== -->

  <div
    id="kommoChatFrame"
    aria-hidden="true"
  >

    <div
      id="amo-livechat"
      class="amo-livechat amo-livechat_frame amo-livechat--no-mobile amo-livechat_hidden"
      style="background: none;"
    >

      <iframe
        title="Kommo Live Chat"
        name="amo-livechat-iframe-b61sU1U2"
        src="https://gso.kommo.com/livechat/index.html?f4Z6G1mL4LI9f_2kboV0x"
      >
      </iframe>

    </div>

  </div>


  <!-- =====================================================
       BOTÓN CERRAR
  ====================================================== -->

  <button
    id="kommoClose"
    type="button"
    aria-label="Cerrar chat"
  >

    <svg
      viewBox="0 0 24 24"
      fill="none"
      aria-hidden="true"
      width="24"
      height="24"
    >

      <path
        d="M6 6L18 18M18 6L6 18"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      />

    </svg>

  </button>


  <!-- =====================================================
       CONTROL DEL CHAT
  ====================================================== -->

  <script>

    (function() {


      const frame =
        document.getElementById(
          'kommoChatFrame'
        );


      const closeBtn =
        document.getElementById(
          'kommoClose'
        );


      const kommoBtn =
        document.getElementById(
          'botonKommo'
        );


      let chatReady =
        false;


      let pendingOpen =
        false;


      /* ===================================================
         LOADING
      ==================================================== */

      function setBtnLoading(
        isLoading
      ) {

        if (!kommoBtn)
          return;


        kommoBtn.classList.toggle(
          'is-loading',
          !!isLoading
        );


        kommoBtn.style.pointerEvents =
          isLoading
            ? 'none'
            : '';


        kommoBtn.style.opacity =
          isLoading
            ? '0.75'
            : '';

      }


      /* ===================================================
         ABRIR CHAT
      ==================================================== */

      function doOpen() {


        setBtnLoading(false);


        if (!frame ||
            !closeBtn) {

          return;

        }


        /*
         * Misma lógica que encontramos
         * en la landing de referencia.
         */

        frame.classList.add(
          'is-open'
        );


        closeBtn.classList.add(
          'is-open'
        );


        /*
         * Kommo abre su propio chat.
         */

        try {

          if (
            typeof crmPlugin ===
            'function'
          ) {

            crmPlugin(
              'runChatShow'
            );

          }

        } catch (_) {}


        /* =================================================
           META PIXEL
        ================================================= */


        if (
          typeof fbq ===
          'function'
        ) {


          /*
           * Evento estándar de contacto.
           */

          fbq(
            'track',
            'Contact'
          );


          /*
           * Evento personalizado para
           * identificar específicamente
           * el botón de la landing.
           */

          fbq(
            'trackCustom',
            'ClickBotonKommo'
          );

        }

      }


      /* ===================================================
         CLICK BOTÓN
      ==================================================== */

      function openChat(ev) {


        if (ev) {

          ev.preventDefault();

        }


        if (!chatReady) {


          pendingOpen =
            true;


          setBtnLoading(
            true
          );


          return;

        }


        doOpen();

      }


      /* ===================================================
         CERRAR
      ==================================================== */

      function closeChat() {


        if (frame) {

          frame.classList.remove(
            'is-open'
          );

        }


        if (closeBtn) {

          closeBtn.classList.remove(
            'is-open'
          );

        }


        if (
          typeof crmPlugin ===
          'function'
        ) {

          try {

            crmPlugin(
              'runChatHide'
            );

          } catch (_) {}

        }

      }


      /* ===================================================
         ESPERAR A KOMMO
      ==================================================== */

      function bindKommo() {


        if (
          typeof crmPlugin !==
          'function'
        ) {


          setTimeout(
            bindKommo,
            100
          );


          return;

        }


        /* =================================================
           KOMMO LISTO
        ================================================= */


        crmPlugin(
          'onChatReady',
          function() {


            chatReady =
              true;


            setBtnLoading(
              false
            );


            if (
              pendingOpen
            ) {


              pendingOpen =
                false;


              doOpen();

            }

          }
        );


        /* =================================================
           KOMMO MOSTRÓ EL CHAT
        ================================================= */


        crmPlugin(
          'onChatShow',
          function() {


            if (frame) {

              frame.classList.add(
                'is-open'
              );

              frame.setAttribute(
                'aria-hidden',
                'false'
              );

            }


            if (closeBtn) {

              closeBtn.classList.add(
                'is-open'
              );

            }

          }
        );


        /* =================================================
           KOMMO OCULTÓ EL CHAT
        ================================================= */


        crmPlugin(
          'onChatHide',
          function() {


            if (frame) {

              frame.classList.remove(
                'is-open'
              );

              frame.setAttribute(
                'aria-hidden',
                'true'
              );

            }


            if (closeBtn) {

              closeBtn.classList.remove(
                'is-open'
              );

            }

          }
        );

      }


      /* ===================================================
         EVENTOS
      ==================================================== */


      if (kommoBtn) {

        kommoBtn.addEventListener(
          'click',
          openChat
        );

      }


      if (closeBtn) {

        closeBtn.addEventListener(
          'click',
          closeChat
        );

      }


      document.addEventListener(
        'keydown',
        function(ev) {


          if (
            ev.key ===
            'Escape'
          ) {

            closeChat();

          }

        }
      );


      /* ===================================================
         INICIO
      ==================================================== */


      setBtnLoading(
        false
      );


      bindKommo();


    })();

  </script>


</body>

</html>
