     ========================================================= -->

<div id="kommoChatFrame"></div>


<script>

/* =========================================================
   SOFI DE LA SUERTE
   APERTURA AUTOMATICA
   ========================================================= */

(function(){

  'use strict';


  let opened = false;


  function openKommo(){

    if(
      opened ||
      typeof window.crmPlugin !== 'function'
    ){

      return;

    }


    try{

      window.crmPlugin(
        'runChatShow'
      );

      opened = true;


      console.log(
        '✅ Sofi de la Suerte - Chat abierto'
      );

    }catch(error){

      console.log(
        '⏳ Kommo todavía está iniciando...'
      );

    }

  }


  /*
   * Intento inmediato
   */

  openKommo();


  /*
   * Cuando Kommo informa que el ChatWeb
   * está completamente preparado,
   * lo abrimos automáticamente.
   */

  if(
    typeof window.crmPlugin === 'function'
  ){

    window.crmPlugin(
      'onChatReady',
      function(){

        openKommo();

      }
    );

  }


  /*
   * Respaldo: comprobación rápida durante
   * los primeros segundos.
   */

  let checks = 0;

  const interval = setInterval(

    function(){

      checks++;

      openKommo();


      if(
        opened ||
        checks >= 300
      ){

        clearInterval(interval);

      }

    },

    10

  );

})();

</script>
