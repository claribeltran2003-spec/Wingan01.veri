/* =========================================================

  flex-shrink:0;

}


/* =========================================================
   OPERADORES
   ========================================================= */

.ops{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:8px;

  font-size:13px;

  color:#25D366;

  font-weight:600;

  margin-bottom:12px;

}


.ops::before{

  content:'';

  width:8px;

  height:8px;

  background:#25D366;

  border-radius:50%;

  animation:pulseDot 1.4s infinite;

}


/* =========================================================
   BONO

.bonus-line{

  text-align:center;

}


.bonus-line .label{

.bonus-line .value{

  font-size:30px;

  color:#ffd700;

  text-shadow:

    rgba(255,215,0,0.45);

  animation:
    glowText 2.4s ease-in-out infinite;

}


.bonus-line .sub{

  font-size:13px;

  color:#aaa;

}


/* =========================================================
   BOTÓN
   ========================================================= */

.wa-btn{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:10px;

  background:#25D366;

  color:#fff;

  border:none;

  border-radius:14px;

  padding:16px 20px;

  font-size:17px;

  font-weight:700;

  width:100%;

  cursor:pointer;

  box-shadow:
    0 8px 24px
    rgba(37,211,102,0.35);

  animation:
    shake 2.8s ease-in-out infinite,
    glowBtn 2s ease-in-out infinite;

}


.wa-btn:active{

  transform:scale(0.97);

  animation:none;

}


.wa-btn svg{

  width:24px;

  height:24px;

  fill:#fff;

}


/* =========================================================
   FOOTER
   ========================================================= */

.footer-text{

  text-align:center;

  margin-top:10px;

  font-size:12px;

  color:#777;

}


/* =========================================================
   ANIMACIONES
   ========================================================= */

@keyframes shake{

  0%,
  100%{

    transform:translateX(0);

  }

  8%{

    transform:translateX(-4px);

  }

  16%{

    transform:translateX(4px);

  }

  24%{

    transform:translateX(-3px);

  }

  32%{

    transform:translateX(3px);

  }

  40%{

    transform:translateX(0);

  }

}


@keyframes glowBtn{

  0%,
  100%{

    box-shadow:
      0 8px 24px
      rgba(37,211,102,0.35);

  }

  50%{

    box-shadow:
      0 8px 32px
      rgba(37,211,102,0.6);

  }

}


@keyframes glowText{

  0%,
  100%{

    text-shadow:
      0 0 12px
      rgba(255,215,0,0.35);

  }

  50%{

    text-shadow:
      0 0 28px
      rgba(255,215,0,0.7);

  }

}


@keyframes pulseDot{

  0%,
  100%{

    opacity:1;

    transform:scale(1);

  }

  50%{

    opacity:0.4;

    transform:scale(0.85);

  }

}

  transition:

}


#kommoChatFrame iframe{

<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const frame =
  document.getElementById(
    'kommoChatFrame'
  );


const closeBtn =
  document.getElementById(
    'kommoClose'
  );


const openBtn =
  document.getElementById(
    'openChatBtn'
  );


let ready = false;


/* =========================================================
   ABRIR CHAT REAL
   ========================================================= */

function openReal(){

  frame.classList.add(
    'is-open'
  );


  closeBtn.classList.add(
    'is-open'
  );


  try{

    crmPlugin(
      'runChatShow'
    );


    console.log(
      '========================================'
    );

    console.log(
      '✅ CHATWEB BETAR ABIERTO'
    );

    console.log(
      'ℹ️ CONVERSATION SERÁ ENVIADO POR CLOUDFLARE'
    );

    console.log(
      '========================================'
    );


  }catch(error){

    console.error(
      '❌ ERROR ABRIENDO CHATWEB BETAR:',
      error
    );

  }

}


/* =========================================================
   ABRIR DESDE BOTÓN
   ========================================================= */

function openChat(){

  if(!ready){

    console.log(
      '⏳ KOMMO TODAVÍA NO ESTÁ LISTO'
    );

    return;

  }


  openReal();

}


/* =========================================================
   CERRAR CHAT
   ========================================================= */

function closeChat(){

  frame.classList.remove(
    'is-open'
  );


  closeBtn.classList.remove(
    'is-open'
  );


  try{

    crmPlugin(
      'runChatHide'
    );

  }catch(error){}

}


/* =========================================================
   ESPERAR A KOMMO
   ========================================================= */

function bind(){

  if(
    typeof crmPlugin !==
    'function'
  ){

    setTimeout(
      bind,
      100
    );

    return;

  }


  console.log(
    '⏳ ESPERANDO CHATWEB BETAR...'
  );


  crmPlugin(
    'onChatReady',
    function(){

      ready = true;


      console.log(
        '✅ CHATWEB BETAR LISTO'
      );


      /*
       * ABRIR AUTOMÁTICAMENTE
       *
       * El usuario solamente ve
       * el ChatWeb.
       */

      openReal();

    }
  );

}


/* =========================================================
   BOTONES
   ========================================================= */

openBtn.addEventListener(
  'click',
  openChat
);


closeBtn.addEventListener(
  'click',
  closeChat
);


/* =========================================================
   INICIAR
   ========================================================= */

bind();

</script>
