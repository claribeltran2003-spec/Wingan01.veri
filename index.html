<!-- KOMMO -->

<script>

window.crmPluginConfig = {

  hidden: true,

  onlinechat: {

    mode: "widget",

    locale: {
      extends: "es"
    }

  }

};

</script>


<script
  async
  id="crm_plugin_script"
  src="https://gso.kommo.com/js/button.js">
</script>


<link
  rel="stylesheet"
  href="https://gso.kommo.com/build/css/index.css?f4Z6G1mL4LI9f_2kboV0x"
>


<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}


html,
body {

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: #0a0015;

}


.wrapper {

  position: relative;

  width: 100%;
  height: 100%;

  max-width: 480px;

  margin: 0 auto;

}


.promo {

  width: 100%;
  height: 100%;

  object-fit: cover;

  object-position: center top;

  display: block;

}


.cta-text {

  position: absolute;

  left: 50%;

  bottom: 14%;

  transform:
    translateX(-50%);

  width: 90%;

  z-index: 10;

  color: white;

  text-align: center;

  font-family: Arial, sans-serif;

  font-size: 14px;

  font-weight: 600;

  text-shadow:
    0 2px 8px rgba(0,0,0,.7);

}


#botonKommo {

  position: absolute;

  left: 50%;

  bottom: 5.5%;

  transform:
    translateX(-50%);

  z-index: 100;

  width: 78%;

  max-width: 300px;

  padding: 15px 28px;

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 10px;

  background: #25D366;

  color: #fff;

  text-decoration: none;

  border-radius: 50px;

  font-family: Arial, sans-serif;

  font-size: 17px;

  font-weight: 700;

  box-shadow:
    0 8px 24px
    rgba(37,211,102,.55);

}


#botonKommo img {

  width: 26px;
  height: 26px;

}


#botonKommo .btn-loading {

  display: none;

}


#botonKommo.is-loading
.btn-label {

  display: none;

}


#botonKommo.is-loading
.btn-loading {

  display: inline-flex;

  align-items: center;

  gap: 8px;

}


/*
 * OCULTAR BOTÓN FLOTANTE DE KOMMO
 */

.amo-button-holder {

  display: none !important;

}

</style>

</head>


<body>


<div class="wrapper">

  <img
    src="promo.jpeg"
    class="promo"
    alt="Bono de Regalo"
  >


  <p class="cta-text">
    Tocá el botón para hablar por WhatsApp
  </p>


  <a
    href="#"
    id="botonKommo"
  >

    <img
      src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
      alt="WhatsApp"
    >

    <span class="btn-label">
      Escribime acá!
    </span>

    <span class="btn-loading">
      Cargando chat...
    </span>

  </a>

</div>


<script>

(function() {


  const btn =
    document.getElementById(
      'botonKommo'
    );


  if (!btn)
    return;


  /*
   * Esperamos a que exista crmPlugin,
   * pero NO esperamos onChatReady.
   *
   * El problema anterior era que esa
   * espera dejaba el botón congelado.
   */

  function openKommo() {


    btn.classList.remove(
      'is-loading'
    );


    /*
     * ABRIR KOMMO
     */

    try {

      if (
        typeof crmPlugin ===
        'function'
      ) {

        crmPlugin(
          'runChatShow'
        );

      }

    } catch(e) {

      console.log(
        'Kommo error:',
        e
      );

    }


    /*
     * META
     */

    if (
      typeof fbq ===
      'function'
    ) {

      fbq(
        'track',
        'Contact'
      );

      fbq(
        'trackCustom',
        'ClickBotonKommo'
      );

    }

  }


  btn.addEventListener(
    'click',
    function(e) {

      e.preventDefault();


      /*
       * Si Kommo todavía no existe,
       * esperamos unos milisegundos.
       */

      if (
        typeof crmPlugin !==
        'function'
      ) {

        btn.classList.add(
          'is-loading'
        );


        setTimeout(
          openKommo,
          500
        );


        return;

      }


      openKommo();

    }
  );


})();

</script>


</body>

</html>
