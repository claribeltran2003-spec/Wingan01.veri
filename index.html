<script>

/* =========================================================
   ABRIR KOMMO INMEDIATAMENTE
   ========================================================= */

(function(){

  'use strict';


  let attempts = 0;

  const maxAttempts = 100;


  function openChat(){

    attempts++;


    if(
      typeof window.crmPlugin === 'function'
    ){

      try{

        window.crmPlugin(
          'runChatShow'
        );

        console.log(
          '✅ Sofi de la Suerte - Chat Kommo abierto'
        );

        return;

      }catch(error){

        console.error(
          'Error abriendo Kommo:',
          error
        );

      }

    }


    /*
     * Si Kommo todavía no terminó de cargar,
     * volvemos a intentar rápidamente.
     */

    if(attempts < maxAttempts){

      setTimeout(
        openChat,
        10
      );

    }

  }


  /*
   * Ejecutar inmediatamente
   */

  openChat();


})();

</script>
