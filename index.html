    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',

  <!-- Widget Kommo -->
  <script>
    (function(a,m,o,c,r,m){
      a[m]={
        id:"1078895",

  <script>
    // Auto abrir chat
    function openChat() {
      try {
        if (typeof crmPlugin === 'function') {
          crmPlugin('runChatShow');
          return true;
        }
      } catch (e) {}
      return false;
    }

    let attempts = 0;
    const interval = setInterval(function() {
      attempts++;
      if (openChat() || attempts >= 20) clearInterval(interval);
    }, 300);

    // Detectar clic en botones de WhatsApp dentro del chat
    document.addEventListener('click', function(e) {
      let target = e.target;

      // Subir hasta encontrar un enlace
      while (target && target !== document) {
        if (target.tagName === 'A' && target.href) {
          const href = target.href.toLowerCase();
          if (href.includes('wa.me') || href.includes('api.whatsapp.com') || href.includes('whatsapp.com')) {
            // Disparar evento Contact
            fbq('track', 'Contact');
            console.log('✅ Evento Contact disparado por clic en WhatsApp');
            break;
          }
        }
        target = target.parentElement;
      }
    }, true); // true = captura el clic aunque esté dentro del iframe/widget
  </script>
