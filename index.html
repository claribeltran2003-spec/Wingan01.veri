<script>
  let contactFired = false;

  function fireContact() {
    if (contactFired) return;
    contactFired = true;
    fbq('track', 'Contact');
    console.log('Evento Contact disparado');
  }

  // 1. Detectar por click (más amplio)
  document.addEventListener('click', function(e) {
    const el = e.target;
    const isChatButton = 
      el.closest('[id*="crm"]') ||
      el.closest('[class*="kommo"]') ||
      el.closest('[class*="amo"]') ||
      el.closest('[class*="chat"]') ||
      el.closest('div[role="button"]') ||
      (el.tagName === 'DIV' && el.style && el.style.backgroundColor);

    if (isChatButton) {
      setTimeout(fireContact, 500);
    }
  });

  // 2. Backup: MutationObserver por si el click no agarra
  const observer = new MutationObserver(function(mutations) {
    for (const mutation of mutations) {
      for (const node of mutation.addedNodes) {
        if (node.nodeType === 1) {
          const text = node.innerText || '';
          if (
            text.includes('WhatsApp') || 
            text.includes('Bienvenido') || 
            node.querySelector?.('iframe') ||
            (node.className && String(node.className).toLowerCase().includes('chat'))
          ) {
            fireContact();
            return;
          }
        }
      }
    }
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });
</script>
