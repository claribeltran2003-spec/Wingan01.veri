  position:fixed;

  inset:0;

  background:#0a0a0a;

  visibility:hidden;

  opacity:0;

  z-index:9999;

  transition:none;

}


/* =========================================================
   CHAT ABIERTO
   ========================================================= */

#kommoChatFrame.is-open{

  visibility:visible;

  opacity:1;

}


/* =========================================================
   IFRAME KOMMO
   ========================================================= */

  width:100% !important;

<!-- =========================================================
     CONTENEDOR KOMMO
     ========================================================= -->

<div id="kommoChatFrame"></div>


<script>

/* =========================================================
   ELEMENTO
   ========================================================= */

const frame =
  document.getElementById(
    'kommoChatFrame'
  );


/* =========================================================
   EVITAR DOBLE APERTURA
   ========================================================= */

let chatOpened = false;


/* =========================================================
   ABRIR CHAT
   ========================================================= */

function openChat(){

  if(chatOpened){

    return;

  }


  chatOpened = true;


  /*
   * Primero mostramos el contenedor.
   * Esto permite que Kommo pueda renderizar
   * correctamente el iframe.
   */

  frame.classList.add(
    'is-open'
  );


  /*
   * Inmediatamente después
   * ejecutamos la apertura de Kommo.
   */

  try{

    crmPlugin(
      'runChatShow'
    );

    console.log(
      '✅ SOFI DE LA SUERTE - CHAT ABIERTO'
    );

  }catch(error){

    chatOpened = false;

    console.error(
      '❌ ERROR KOMMO:',
      error
    );

  }

}


/* =========================================================
   ESPERAR ÚNICAMENTE A KOMMO
   ========================================================= */

function initChat(){

  if(
    typeof crmPlugin !==
    'function'
  ){

    requestAnimationFrame(
      initChat
    );

    return;

  }


  /*
   * Nos enganchamos al evento real
   * de Kommo.
   */

  crmPlugin(
    'onChatReady',
    function(){

      console.log(
        '✅ KOMMO CHAT READY'
      );


      /*
       * Abrir inmediatamente.
       */

      openChat();

    }
  );

}


/* =========================================================
   INICIO
   ========================================================= */

initChat();

</script>
