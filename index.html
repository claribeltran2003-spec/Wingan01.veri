<head>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #4a0080 0%, #7b1fa2 45%, #c2185b 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      color: white;
      text-align: center;
      padding: 24px 18px;
      position: relative;
    }

    .chip {
      position: absolute;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff5252, #b71c1c);
      border: 4px solid #ffcdd2;
      opacity: 0.9;
      z-index: 1;
    }
    .chip::after {
      content: '';
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      border: 2px dashed rgba(255,255,255,0.45);
    }
    .chip1 { top: 7%; left: 4%; transform: rotate(-18deg); }
    .chip2 { top: 12%; right: 6%; transform: rotate(22deg); width: 48px; height: 48px; }
    .chip3 { bottom: 22%; left: 6%; transform: rotate(12deg); width: 42px; height: 42px; }
    .chip4 { bottom: 16%; right: 5%; transform: rotate(-20deg); width: 52px; height: 52px; }

    .content {
      position: relative;
      z-index: 10;
      max-width: 400px;
      width: 100%;
    }

    .badge {
      display: inline-block;
      background: rgba(0,0,0,0.28);
      padding: 7px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.4px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(21px, 5.8vw, 26px);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 6px;
      text-transform: uppercase;
      text-shadow: 0 3px 12px rgba(0,0,0,0.35);
    }

    .gold {
      background: linear-gradient(180deg, #ffe57f 0%, #ffb300 45%, #ff6f00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: clamp(34px, 9.5vw, 44px);
      font-weight: 900;
      line-height: 1.05;
      margin: 4px 0 22px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .subtitle {
      font-size: 15px;
      line-height: 1.45;
      opacity: 0.95;
      margin-bottom: 30px;
    }

    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #25D366;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      padding: 17px 32px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.5);
      width: 100%;
      max-width: 300px;
    }

    .cta-btn:active { transform: scale(0.97); }

    .cta-btn img {
      width: 26px;
      height: 26px;
      display: block;
    }

    .note { margin-top: 20px; font-size: 13px; opacity: 0.88; }
    .domain { margin-top: 28px; font-size: 14px; font-weight: 600; opacity: 0.9; }
  </style>
</head>
<body>

  <div class="chip chip1"></div>
  <div class="chip chip2"></div>
  <div class="chip chip3"></div>
  <div class="chip chip4"></div>

  <div class="content">
    <div class="badge">CASINO ONLINE • 24HS</div>

    <h1>Con tu primera carga<br>pedí tu</h1>
    <div class="gold">BONO DE<br>REGALO</div>

    <p class="subtitle">
      Escribime y te ayudo a acreditar tus fichas<br>
      con el bono incluido.
    </p>

    <button class="cta-btn" id="btnChat" type="button">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" width="26" height="26">
      Escribime acá!
    </button>

    <p class="note">Atención personalizada • Respuesta rápida</p>
    <p class="domain">www.ganamos.net</p>
  </div>

  <script>
    (function(a,m,o,c,r,m){
      a[m]={
        id:"1078895",
        hash:"7afe8c661ae21b1eb55f38b542603609f977ea292469fbd2b5cb0cf03380b008",
        locale:"es",
        setMeta:function(p){this.params=(this.params||[]).concat([p])}
      };
      a[o]=a[o]||function(){(a[o].q=a[o].q||[]).push(arguments)};
      var d=a.document,s=d.createElement('script');
      s.async=true;
      s.id=m+'_script';
      s.src='https://gso.kommo.com/js/button.js';
      d.head&&d.head.appendChild(s)
    }(window,0,'crmPlugin',0,0,'crm_plugin'));
  </script>

  <script>
    setTimeout(function() {
      if (typeof fbq === 'function') fbq('track', 'Contact');
    }, 2500);

    // Mover el botón de Kommo FUERA de la pantalla (no lo borramos)
    function moverBotonKommo() {
      var btn = document.getElementById('crm_plugin_button');
      if (btn) {
        btn.style.position = 'fixed';
        btn.style.bottom = '-200px';
        btn.style.right = '-200px';
        btn.style.left = 'auto';
        btn.style.top = 'auto';
        btn.style.opacity = '0';
        btn.style.zIndex = '-1';
        btn.style.pointerEvents = 'auto'; // importante: sigue siendo clickeable
      }
    }

    setInterval(moverBotonKommo, 400);
    setTimeout(moverBotonKommo, 800);
    setTimeout(moverBotonKommo, 2000);
    setTimeout(moverBotonKommo, 4000);

    function abrirChat() {
      // Método oficial
      try {
        if (typeof crmPlugin === 'function') {
          crmPlugin('runChatShow');
        }
      } catch(e) {}

      // Clic real al botón (aunque esté fuera de pantalla)
      var btn = document.getElementById('crm_plugin_button');
      if (btn) {
        try { btn.click(); } catch(e) {}
      }

      setTimeout(function() {
        try { crmPlugin('runChatShow'); } catch(e) {}
        if (btn) try { btn.click(); } catch(e) {}
      }, 500);

      setTimeout(function() {
        try { crmPlugin('runChatShow'); } catch(e) {}
      }, 1200);
    }

    document.getElementById('btnChat').addEventListener('click', function(e) {
      e.preventDefault();
      abrirChat();
    });
  </script>

</body>
</html>
