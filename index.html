<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>GANAMOS - Bono de Regalo</title>


  <!-- =====================================================
       FACEBOOK PIXEL
  ====================================================== -->

  <script>
    !function(f,b,e,v,n,t,s)
    {
      if(f.fbq)return;

      n=f.fbq=function(){
        n.callMethod ?
        n.callMethod.apply(n,arguments) :
        n.queue.push(arguments)
      };

      if(!f._fbq)f._fbq=n;

      n.push=n;
      n.loaded=!0;
      n.version='2.0';
      n.queue=[];

      t=b.createElement(e);
      t.async=!0;
      t.src=v;

      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s);

    }(
      window,
      document,
      'script',
      'https://connect.facebook.net/en_US/fbevents.js'
    );

    fbq('init', '1993981097970015');
    fbq('track', 'PageView');
  </script>


  <noscript>

    <img
      height="1"
      width="1"
      style="display:none"
      src="https://www.facebook.com/tr?id=1993981097970015&ev=PageView&noscript=1"
    />

  </noscript>


  <!-- =====================================================
       KOMMO CONFIG
  ====================================================== -->

  <script>

    window.crmPluginConfig = {

      hidden: true,

      onlinechat: {

        mode: "widget",

        locale: {
          extends: "es"
        }

      }

    };

  </script>


  <!-- =====================================================
       ESTILOS
  ====================================================== -->

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #0a0015;

    }


    .wrapper {

      position: relative;

      width: 100%;
      height: 100%;

      max-width: 480px;

      margin: 0 auto;

    }


    .promo {

      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position: center top;

      display: block;

    }


    /* =====================================================
       TEXTO
    ====================================================== */

    .cta-text {

      position: absolute;

      left: 50%;

      transform: translateX(-50%);

      bottom: 14%;

      z-index: 50;

      width: 90%;

      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 14px;

      font-weight: 600;

      text-align: center;

      letter-spacing: 0.2px;

      text-shadow:
        0 2px 8px rgba(0,0,0,0.7);

    }


    /* =====================================================
       BOTÓN VERDE
    ====================================================== */

    .wa-btn {

      position: absolute;

      left: 50%;

      transform: translateX(-50%);

      bottom: 5.5%;

      z-index: 50;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      width: 78%;

      max-width: 300px;

      padding: 15px 28px;

      background: #25D366;

      color: #fff;

      text-decoration: none;

      border: none;

      border-radius: 50px;

      cursor: pointer;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 17px;

      font-weight: 700;

      box-shadow:
        0 8px 24px rgba(37, 211, 102, 0.55);

      -webkit-tap-highlight-color: transparent;

      animation:
        pulse 1.6s ease-in-out infinite;

    }


    .wa-btn:active {

      transform:
        translateX(-50%)
        scale(0.97);

    }


    .wa-btn img {

      width: 26px;

      height: 26px;

      display: block;

      flex-shrink: 0;

    }


    /* =====================================================
       ANIMACIÓN
    ====================================================== */

    @keyframes pulse {

      0% {

        transform:
          translateX(-50%)
          scale(1);

        box-shadow:
          0 8px 24px rgba(37, 211, 102, 0.45);

      }

      50% {

        transform:
          translateX(-50%)
          scale(1.06);

        box-shadow:
          0 12px 32px rgba(37, 211, 102, 0.75);

      }

      100% {

        transform:
          translateX(-50%)
          scale(1);

        box-shadow:
          0 8px 24px rgba(37, 211, 102, 0.45);

      }

    }


    /* =====================================================
       CONTENEDOR DEL CHAT
    ====================================================== */

    #kommoChatFrame {

      position: fixed;

      inset: 0;

      width: 100%;

      height: 100%;

      z-index: 99999;

      display: none;

      background: rgba(0,0,0,0.35);

    }


    #kommoChatFrame.active {

      display: block;

    }


    #kommoChatFrame iframe {

      position: absolute;

      right: 0;

      bottom: 0;

      width: 100%;

      height: 100%;

      border: 0;

      background: transparent;

    }


    /* =====================================================
       CERRAR CHAT
    ====================================================== */

    #kommoClose {

      position: fixed;

      top: 15px;

      right: 15px;

      z-index: 100001;

      width: 42px;

      height: 42px;

      border: 0;

      border-radius: 50%;

      background: rgba(0,0,0,0.65);

      color: #fff;

      font-size: 25px;

      line-height: 42px;

      text-align: center;

      cursor: pointer;

      display: none;

    }


    #kommoChatFrame.active + #kommoClose {

      display: block;

    }


    /* =====================================================
       OCULTAR BOTÓN FLOTANTE DE KOMMO
    ====================================================== */

    .amo-button-holder,

    #crm_plugin,

    [id*="crm_plugin"],

    [class*="amo-button-holder"] {

      display: none !important;

      visibility: hidden !important;

      opacity: 0 !important;

      pointer-events: none !important;

    }

  </style>

</head>


<body>


  <!-- =====================================================
       LANDING
  ====================================================== -->

  <div class="wrapper">

    <img
      src="promo.jpeg"
      alt="Bono de Regalo"
      class="promo"
    >


    <p class="cta-text">
      Tocá el botón para hablar por WhatsApp
    </p>


    <a
      href="#"
      class="wa-btn"
      id="btnChat"
    >

      <img
        src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
        alt="WhatsApp"
        width="26"
        height="26"
      >

      Escribime acá!

    </a>

  </div>


  <!-- =====================================================
       CHAT KOMMO
  ====================================================== -->

  <div
    id="kommoChatFrame"
    aria-hidden="true"
  >
  </div>


  <button
    id="kommoClose"
    type="button"
    aria-label="Cerrar chat"
  >
    ×
  </button>


  <!-- =====================================================
       SCRIPT ORIGINAL DE KOMMO
  ====================================================== -->

  <script>

    (function(a,m,o,c,r,m){

      a[m] = {

        id: "1078895",

        hash:
          "7afe8c661ae21b1eb55f38b542603609f977ea292469fbd2b5cb0cf03380b008",

        locale: "es",

        setMeta: function(p){

          this.params =
            (this.params || []).concat([p]);

        }

      };


      a[o] = a[o] || function(){

        (a[o].q = a[o].q || []).push(arguments);

      };


      var d = a.document;

      var s = d.createElement("script");

      s.async = true;

      s.id = m + "_script";

      s.src =
        "https://gso.kommo.com/js/button.js";


      d.head.appendChild(s);


    }(
      window,
      0,
      "crmPlugin",
      0,
      0,
      "crm_plugin"
    ));

  </script>


  <!-- =====================================================
       CONTROL DEL CHAT
  ====================================================== -->

  <script>

    var kommoIframe = null;


    /*
     * Buscamos el iframe que genera Kommo.
     */

    function buscarIframeKommo() {

      var iframe =
        document.querySelector(
          'iframe[title="Kommo Live Chat"]'
        );


      if (iframe) {

        kommoIframe = iframe;

        console.log(
          "Iframe de Kommo encontrado:",
          iframe.src
        );

        return true;

      }

      return false;

    }


    /*
     * Esperar a que Kommo cree el iframe.
     */

    var buscarKommo =
      setInterval(
        function() {

          if (
            buscarIframeKommo()
          ) {

            clearInterval(
              buscarKommo
            );

          }

        },
        300
      );


    /*
     * BOTÓN VERDE
     */

    document
      .getElementById("btnChat")
      .addEventListener(
        "click",
        function(e) {

          e.preventDefault();

          e.stopPropagation();


          /*
           * META PIXEL
           */

          if (
            typeof fbq === "function"
          ) {

            fbq(
              "track",
              "Contact"
            );

          }


          /*
           * Intentar encontrar iframe
           */

          if (!kommoIframe) {

            buscarIframeKommo();

          }


          /*
           * Si Kommo todavía no generó
           * el iframe, usamos su función
           * oficial para inicializarlo.
           */

          if (
            !kommoIframe &&
            typeof crmPlugin === "function"
          ) {

            try {

              crmPlugin(
                "runChatShow"
              );

            } catch(error) {

              console.log(
                "Error Kommo:",
                error
              );

            }

          }


          /*
           * Esperamos brevemente a que
           * aparezca el iframe.
           */

          setTimeout(
            function() {

              buscarIframeKommo();


              if (kommoIframe) {

                var frame =
                  document.getElementById(
                    "kommoChatFrame"
                  );


                /*
                 * Movemos el iframe al
                 * contenedor propio.
                 */

                frame.appendChild(
                  kommoIframe
                );


                frame.classList.add(
                  "active"
                );


                frame.setAttribute(
                  "aria-hidden",
                  "false"
                );


                console.log(
                  "Chat Kommo abierto"
                );

              } else {

                console.log(
                  "No se encontró el iframe de Kommo"
                );

              }

            },
            500
          );

        }
      );


    /*
     * CERRAR CHAT
     */

    document
      .getElementById("kommoClose")
      .addEventListener(
        "click",
        function() {

          var frame =
            document.getElementById(
              "kommoChatFrame"
            );


          frame.classList.remove(
            "active"
          );


          frame.setAttribute(
            "aria-hidden",
            "true"
          );

        }
      );

  </script>


</body>

</html>
