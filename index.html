<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>GANAMOS - Bono de Regalo</title>


  <!-- =====================================================
       FACEBOOK PIXEL
  ====================================================== -->

  <script>
    !function(f,b,e,v,n,t,s)
    {
      if(f.fbq)return;

      n=f.fbq=function(){
        n.callMethod ?
        n.callMethod.apply(n,arguments) :
        n.queue.push(arguments)
      };

      if(!f._fbq)f._fbq=n;

      n.push=n;
      n.loaded=!0;
      n.version='2.0';
      n.queue=[];

      t=b.createElement(e);
      t.async=!0;
      t.src=v;

      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s);

    }(
      window,
      document,
      'script',
      'https://connect.facebook.net/en_US/fbevents.js'
    );

    fbq('init', '1993981097970015');
    fbq('track', 'PageView');
  </script>


  <noscript>

    <img
      height="1"
      width="1"
      style="display:none"
      src="https://www.facebook.com/tr?id=1993981097970015&ev=PageView&noscript=1"
    />

  </noscript>


  <!-- =====================================================
       KOMMO CONFIGURACIÓN
  ====================================================== -->

  <script>

    window.crmPluginConfig = {

      hidden: true,

      onlinechat: {

        mode: "widget",

        locale: {
          extends: "es"
        }

      }

    };

  </script>


  <!-- =====================================================
       ESTILOS
  ====================================================== -->

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #0a0015;

    }


    .wrapper {

      position: relative;

      width: 100%;
      height: 100%;

      max-width: 480px;

      margin: 0 auto;

    }


    .promo {

      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position: center top;

      display: block;

    }


    /* =====================================================
       TEXTO
    ====================================================== */

    .cta-text {

      position: absolute;

      left: 50%;

      transform: translateX(-50%);

      bottom: 14%;

      z-index: 50;

      width: 90%;

      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 14px;

      font-weight: 600;

      text-align: center;

      letter-spacing: 0.2px;

      text-shadow:
        0 2px 8px rgba(0,0,0,0.7);

    }


    /* =====================================================
       BOTÓN VERDE
    ====================================================== */

    .wa-btn {

      position: absolute;

      left: 50%;

      transform: translateX(-50%);

      bottom: 5.5%;

      z-index: 50;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      width: 78%;

      max-width: 300px;

      padding: 15px 28px;

      background: #25D366;

      color: #fff;

      text-decoration: none;

      border: none;

      border-radius: 50px;

      cursor: pointer;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 17px;

      font-weight: 700;

      box-shadow:
        0 8px 24px rgba(37, 211, 102, 0.55);

      -webkit-tap-highlight-color: transparent;

      animation:
        pulse 1.6s ease-in-out infinite;

    }


    .wa-btn:active {

      transform:
        translateX(-50%)
        scale(0.97);

    }


    .wa-btn img {

      width: 26px;

      height: 26px;

      display: block;

      flex-shrink: 0;

    }


    /* =====================================================
       ANIMACIÓN
    ====================================================== */

    @keyframes pulse {

      0% {

        transform:
          translateX(-50%)
          scale(1);

        box-shadow:
          0 8px 24px rgba(37, 211, 102, 0.45);

      }

      50% {

        transform:
          translateX(-50%)
          scale(1.06);

        box-shadow:
          0 12px 32px rgba(37, 211, 102, 0.75);

      }

      100% {

        transform:
          translateX(-50%)
          scale(1);

        box-shadow:
          0 8px 24px rgba(37, 211, 102, 0.45);

      }

    }


    /* =====================================================
       CONTENEDOR DEL CHAT
    ====================================================== */

    #kommoChatFrame {

      position: fixed !important;

      inset: 0 !important;

      width: 100vw !important;

      height: 100vh !important;

      z-index: 99999 !important;

      display: none !important;

      background: rgba(0,0,0,0.35);

    }


    #kommoChatFrame.active {

      display: block !important;

    }


    /* =====================================================
       CHAT REAL DE KOMMO
    ====================================================== */

    #kommoChatFrame .amo-livechat {

      position: fixed !important;

      inset: 0 !important;

      width: 100vw !important;

      height: 100vh !important;

      display: block !important;

      visibility: visible !important;

      opacity: 1 !important;

      z-index: 100000 !important;

      background: transparent !important;

    }


    /*
     * Kommo utiliza esta clase para ocultarlo.
     */

    #kommoChatFrame .amo-livechat_hidden {

      display: block !important;

      visibility: visible !important;

      opacity: 1 !important;

    }


    /* =====================================================
       IFRAME DE KOMMO
    ====================================================== */

    #kommoChatFrame iframe[title="Kommo Live Chat"] {

      display: block !important;

      visibility: visible !important;

      opacity: 1 !important;

      position: fixed !important;

      top: 0 !important;

      left: 0 !important;

      width: 100vw !important;

      height: 100vh !important;

      min-width: 100vw !important;

      min-height: 100vh !important;

      border: 0 !important;

      background: #fff !important;

      z-index: 100001 !important;

    }


    /* =====================================================
       CERRAR CHAT
    ====================================================== */

    #kommoClose {

      position: fixed !important;

      top: 15px !important;

      right: 15px !important;

      z-index: 100002 !important;

      width: 42px !important;

      height: 42px !important;

      border: 0 !important;

      border-radius: 50% !important;

      background: rgba(0,0,0,0.70) !important;

      color: #fff !important;

      font-size: 25px !important;

      line-height: 42px !important;

      text-align: center !important;

      cursor: pointer !important;

      display: none !important;

    }


    #kommoChatFrame.active ~ #kommoClose {

      display: block !important;

    }


    /* =====================================================
       OCULTAR BOTÓN FLOTANTE DE KOMMO
    ====================================================== */

    .amo-button-holder,

    .amo-button-holder.amo-horisontal,

    #crm_plugin,

    [id*="crm_plugin"] {

      display: none !important;

      visibility: hidden !important;

      opacity: 0 !important;

      pointer-events: none !important;

    }

  </style>

</head>


<body>


  <!-- =====================================================
       LANDING
  ====================================================== -->

  <div class="wrapper">


    <img
      src="promo.jpeg"
      alt="Bono de Regalo"
      class="promo"
    >


    <p class="cta-text">
      Tocá el botón para hablar por WhatsApp
    </p>


    <!-- ===================================================
         BOTÓN PRINCIPAL
         Es un <a> como el de Activos Black
    ==================================================== -->

    <a
      href="#"
      class="wa-btn"
      id="btnChat"
    >

      <img
        src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
        alt="WhatsApp"
        width="26"
        height="26"
      >

      Escribime acá!

    </a>


  </div>


  <!-- =====================================================
       CONTENEDOR DEL CHAT
  ====================================================== -->

  <div
    id="kommoChatFrame"
    aria-hidden="true"
  >
  </div>


  <!-- =====================================================
       BOTÓN CERRAR
  ====================================================== -->

  <button
    id="kommoClose"
    type="button"
    aria-label="Cerrar chat"
  >
    ×
  </button>


  <!-- =====================================================
       SCRIPT ORIGINAL DE KOMMO
  ====================================================== -->

  <script>

    (function(a,m,o,c,r,m){

      a[m] = {

        id: "1078895",

        hash:
          "7afe8c661ae21b1eb55f38b542603609f977ea292469fbd2b5cb0cf03380b008",

        locale: "es",

        setMeta: function(p){

          this.params =
            (this.params || []).concat([p]);

        }

      };


      a[o] = a[o] || function(){

        (a[o].q = a[o].q || []).push(arguments);

      };


      var d = a.document;

      var s = d.createElement("script");

      s.async = true;

      s.id = m + "_script";

      s.src =
        "https://gso.kommo.com/js/button.js";


      d.head.appendChild(s);


    }(
      window,
      0,
      "crmPlugin",
      0,
      0,
      "crm_plugin"
    ));

  </script>


  <!-- =====================================================
       CONTROL DEL CHAT
  ====================================================== -->

  <script>

    var kommoChatFrame =
      document.getElementById(
        "kommoChatFrame"
      );


    var kommoClose =
      document.getElementById(
        "kommoClose"
      );


    var btnChat =
      document.getElementById(
        "btnChat"
      );


    /* =====================================================
       MOSTRAR CHAT
    ====================================================== */

    function mostrarChatKommo() {

      var livechat =
        document.querySelector(
          ".amo-livechat"
        );


      if (!livechat) {

        console.log(
          "Kommo todavía no creó el chat"
        );

        return false;

      }


      /*
       * IMPORTANTE:
       * No movemos el iframe.
       */

      livechat.classList.remove(
        "amo-livechat_hidden"
      );


      livechat.style.display =
        "block";


      livechat.style.visibility =
        "visible";


      livechat.style.opacity =
        "1";


      /*
       * Mostrar nuestro contenedor
       */

      kommoChatFrame.classList.add(
        "active"
      );


      kommoChatFrame.setAttribute(
        "aria-hidden",
        "false"
      );


      console.log(
        "CHAT KOMMO VISIBLE"
      );


      return true;

    }


    /* =====================================================
       BOTÓN VERDE
    ====================================================== */

    btnChat.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        e.stopPropagation();


        console.log(
          "Botón verde presionado"
        );


        /*
         * META PIXEL
         */

        if (
          typeof fbq === "function"
        ) {

          fbq(
            "track",
            "Contact"
          );

        }


        /*
         * Intentar mostrar inmediatamente
         */

        if (
          mostrarChatKommo()
        ) {

          return;

        }


        /*
         * Si todavía no está creado,
         * pedimos a Kommo que lo muestre.
         */

        if (
          typeof crmPlugin === "function"
        ) {

          try {

            crmPlugin(
              "runChatShow"
            );

          } catch(error) {

            console.log(
              "Error de Kommo:",
              error
            );

          }

        }


        /*
         * Esperar a que Kommo
         * termine de generar el chat.
         */

        var intentos = 0;


        var esperarKommo =
          setInterval(
            function() {

              intentos++;


              if (
                mostrarChatKommo()
              ) {

                clearInterval(
                  esperarKommo
                );

              }


              if (
                intentos >= 30
              ) {

                clearInterval(
                  esperarKommo
                );

                console.log(
                  "Kommo no apareció después de esperar."
                );

              }

            },
            200
          );

      }
    );


    /* =====================================================
       CERRAR CHAT
    ====================================================== */

    kommoClose.addEventListener(
      "click",
      function() {

        kommoChatFrame.classList.remove(
          "active"
        );


        kommoChatFrame.setAttribute(
          "aria-hidden",
          "true"
        );


        var livechat =
          document.querySelector(
            ".amo-livechat"
          );


        if (livechat) {

          livechat.classList.add(
            "amo-livechat_hidden"
          );

        }

      }
    );


  </script>


</body>

</html>
