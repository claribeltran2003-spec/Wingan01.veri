<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kings Ganamos</title>
<meta name="theme-color" content="#ff5a1f">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#080202;
color:#fff;
overflow-x:hidden;
}
body:before{
content:"";
position:fixed;
inset:0;
background:radial-gradient(circle at center,rgba(255,90,31,.12),transparent 45%);
pointer-events:none;
}
.container{
max-width:480px;
margin:auto;
padding:50px 28px 80px;
min-height:100vh;
}
.header{
display:flex;
align-items:center;
gap:12px;
margin-bottom:50px;
}
.logo{
width:56px;height:56px;border-radius:14px;
background:#ff5a1f;color:#000;
display:flex;align-items:center;justify-content:center;
font-weight:900;font-size:30px;
}
.brand{font-size:30px;font-weight:800}
.badge{
margin-left:auto;
padding:10px 14px;
border:1px solid rgba(255,255,255,.15);
border-radius:999px;
font-size:11px;
letter-spacing:2px;
color:#d4d4d4;
}
.online{
margin-bottom:45px;
font-size:12px;
letter-spacing:5px;
color:#a3a3a3;
}
h1{
font-size:52px;
line-height:1;
font-weight:900;
margin-bottom:40px;
}
.desc{
text-align:center;
color:#ff6b35;
font-size:16px;
letter-spacing:5px;
line-height:1.8;
margin-bottom:35px;
}
.arrow{
text-align:center;
font-size:56px;
color:#ff5a1f;
margin-bottom:40px;
}
.bonus{
cursor:pointer;
border:2px solid #ff5a1f;
border-radius:34px;
padding:48px 24px;
text-align:center;
box-shadow:0 0 35px rgba(255,90,31,.25),0 0 80px rgba(255,90,31,.12);
transition:.25s;
}
.bonus:hover{transform:translateY(-4px)}
.bonus:active{transform:scale(.97)}
.percent{
font-size:92px;
font-weight:900;
color:#ff5a1f;
}
.btext{
margin-top:12px;
font-size:18px;
letter-spacing:4px;
line-height:1.8;
}
#kommoChatFrame{
position:fixed;inset:0;
visibility:hidden;opacity:0;
transition:.3s;
background:rgba(0,0,0,.92);
z-index:9999;
}
#kommoChatFrame.is-open{
visibility:visible;
opacity:1;
}
#kommoChatFrame iframe{
width:100%!important;
height:100%!important;
border:0!important;
}
@media(max-width:480px){
h1{font-size:48px}
.percent{font-size:86px}
.btext{font-size:16px}
.online{letter-spacing:4px}
}
</style>

<script>
window.crmPluginConfig={
hidden:true,
color:'#ff5a1f',
onlinechat:{mode:'frame',container:'#kommoChatFrame',locale:{extends:'es'}}
};
</script>
</head>
<body>

<div class="container">

<div class="header">
<div class="logo">K</div>
<div class="brand">KINGS</div>
<div class="badge">PLATAFORMA GANAMOS</div>
</div>

<div class="online">● OPERADORES EN LÍNEA AHORA</div>

<h1>Cargá y jugá<br>en minutos</h1>

<div class="desc">
HACÉ CLICK AQUÍ Y TE<br>
CREAMOS TU CUENTA
</div>

<div class="arrow">↓</div>

<div class="bonus" id="bonusKommo">
<div class="percent">30%</div>
<div class="btext">EXTRA DE BONO EN TU<br>PRIMER DEPÓSITO</div>
</div>

</div>

<div id="kommoChatFrame"></div>

<script>
(function(a,m,o,c,r,mn){
a[mn]={
id:"1078895",
hash:"7afe8c661ae21b1eb55f38b542603609f977ea292469fbd2b5cb0cf03380b008",
locale:"es"
};
a[o]=a[o]||function(){(a[o].q=a[o].q||[]).push(arguments)};
var d=a.document,s=d.createElement('script');
s.async=true;
s.src='https://gso.kommo.com/js/button.js';
d.head.appendChild(s);
}(window,0,'crmPlugin',0,0,'crm_plugin'));

const frame=document.getElementById('kommoChatFrame');
const bonus=document.getElementById('bonusKommo');

let ready=false,pending=false;

function openKommo(){
if(ready){
frame.classList.add('is-open');
try{crmPlugin('runChatShow')}catch(e){}
}else{
pending=true;
}
}

function bindKommo(){
if(typeof crmPlugin!=='function'){
setTimeout(bindKommo,100);
return;
}
crmPlugin('onChatReady',function(){
ready=true;
if(pending){
pending=false;
openKommo();
}
});
}

bonus.addEventListener('click',openKommo);
bindKommo();
</script>

</body>
</html>
