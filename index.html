<style>

/* =========================================================
   RESET
   ========================================================= */

*{

  margin:0;
  padding:0;
  box-sizing:border-box;

}


/* =========================================================
   BODY
   ========================================================= */

html,
body{

  width:100%;
  height:100%;

  overflow:hidden;

  background:#080808;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Helvetica,
    Arial,
    sans-serif;

  color:#fff;

}


/* =========================================================
   BIENVENIDA
   ========================================================= */

#welcome{

  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  display:flex;

  align-items:center;

  justify-content:center;

  flex-direction:column;

  text-align:center;

  padding:30px;

  background:

    radial-gradient(
      circle at center,
      rgba(212,175,55,.15),
      transparent 45%
    ),

    radial-gradient(
      circle at bottom,
      rgba(37,211,102,.06),
      transparent 40%
    ),

    linear-gradient(
      135deg,
      #050505,
      #11100c,
      #050505
    );

  z-index:100000;

  transition:
    opacity .15s ease,
    visibility .15s ease;

}


/* =========================================================
   OCULTAR BIENVENIDA
   ========================================================= */

#welcome.hide{

  opacity:0;

  visibility:hidden;

  pointer-events:none;

}


/* =========================================================
   ICONO
   ========================================================= */

.welcome-icon{

  width:70px;

  height:70px;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:50%;

  border:2px solid #d4af37;

  color:#d4af37;

  font-size:30px;

  margin-bottom:22px;

  box-shadow:
    0 0 25px rgba(212,175,55,.18);

}


/* =========================================================
   TEXTO SUPERIOR
   ========================================================= */

.welcome-small{

  color:#25D366;

  font-size:11px;

  font-weight:800;

  letter-spacing:3px;

  text-transform:uppercase;

  margin-bottom:10px;

}


/* =========================================================
   TITULO
   ========================================================= */

.welcome-title{

  font-size:
    clamp(28px, 8vw, 52px);

  line-height:1.05;

  font-weight:900;

  text-transform:uppercase;

  letter-spacing:-1px;

}


/* =========================================================
   NOMBRE
   ========================================================= */

.welcome-title span{

  display:block;

  margin-top:6px;

  color:#d4af37;

  text-shadow:
    0 0 20px rgba(212,175,55,.25);

}


/* =========================================================
   SUBTITULO
   ========================================================= */

.welcome-subtitle{

  margin-top:18px;

  color:#aaa;

  font-size:14px;

}


/* =========================================================
   LINEA
   ========================================================= */

.welcome-line{

  width:100px;

  height:2px;

  margin-top:24px;

  background:
    linear-gradient(
      90deg,
      transparent,
      #d4af37,
      transparent
    );

}


/* =========================================================
   ONLINE
   ========================================================= */

.online{

  display:flex;

  align-items:center;

  gap:8px;

  margin-top:18px;

  color:#25D366;

  font-size:12px;

  font-weight:700;

}


.online-dot{

  width:8px;

  height:8px;

  border-radius:50%;

  background:#25D366;

  box-shadow:
    0 0 10px rgba(37,211,102,.8);

}


/* =========================================================
   KOMMO
   ========================================================= */

#kommoChatFrame{

  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  background:#080808;

  visibility:hidden;

  opacity:0;

  transition:
    opacity .15s ease;

  z-index:99999;

}


/* =========================================================
   CHAT ABIERTO
   ========================================================= */

#kommoChatFrame.is-open{

  visibility:visible;

  opacity:1;

}


/* =========================================================
   IFRAME
   ========================================================= */

#kommoChatFrame iframe{

  width:100% !important;

  height:100% !important;

  border:0 !important;

}

</style>

<body>


<!-- =========================================================
     BIENVENIDA
     ========================================================= -->

<div id="welcome">

  <div class="welcome-icon">
    ♠
  </div>

  <div class="welcome-small">
    Atención online
  </div>

  <div class="welcome-title">

    BIENVENIDO

    <span>
      A SOFI DE LA SUERTE
    </span>

  </div>

  <div class="welcome-subtitle">
    Tu atención comienza ahora
  </div>

  <div class="welcome-line"></div>

  <div class="online">

    <div class="online-dot"></div>

    Operador online

  </div>

</div>


<!-- =========================================================
     KOMMO
     ========================================================= -->

<div id="kommoChatFrame"></div>


<script>

/* =========================================================
   ELEMENTOS
   ========================================================= */

const frame =
  document.getElementById(
    'kommoChatFrame'
  );


const welcome =
  document.getElementById(
    'welcome'
  );


let ready = false;


/* =========================================================
   ABRIR CHAT
   ========================================================= */

function openReal(){

  /*
   * Mostrar el frame
   */

  frame.classList.add(
    'is-open'
  );


  /*
   * Ocultar bienvenida
   */

  welcome.classList.add(
    'hide'
  );


  /*
   * Abrir Kommo
   */

  try{

    crmPlugin(
      'runChatShow'
    );


    console.log(
      '========================================'
    );

    console.log(
      '✅ SOFI DE LA SUERTE - CHAT ABIERTO'
    );

    console.log(
      '========================================'
    );

  }catch(error){

    console.error(
      '❌ ERROR ABRIENDO KOMMO:',
      error
    );

  }

}


/* =========================================================
   ESPERAR KOMMO
   ========================================================= */

function bind(){

  /*
   * Esperar a que exista crmPlugin
   */

  if(
    typeof crmPlugin !==
    'function'
  ){

    setTimeout(
      bind,
      50
    );

    return;

  }


  console.log(
    '⏳ ESPERANDO KOMMO...'
  );


  /*
   * Evento oficial
   */

  crmPlugin(
    'onChatReady',
    function(){

      ready = true;


      console.log(
        '✅ KOMMO CHAT READY'
      );


      /*
       * Abrir inmediatamente
       */

      openReal();

    }
  );

}


/* =========================================================
   INICIO
   ========================================================= */

bind();

</script>


</body>
</html>
