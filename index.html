<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GANAMOS - Bono de Regalo</title>

  <!-- Facebook Pixel -->
  <script>

    n.callMethod.apply(n,arguments):n.queue.push(arguments)};

    n.queue=[];t=b.createElement(e);t.async=!0;

  <noscript>
    <img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1993981097970015&ev=PageView&noscript=1"/>
  </noscript>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #4a0080 0%, #7b1fa2 45%, #c2185b 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      color: white;
      text-align: center;
      padding: 24px 18px;
      position: relative;
    }

    /* Fichas decorativas */
    .chip {
      position: absolute;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ff5252, #b71c1c);
      border: 4px solid #ffcdd2;
      opacity: 0.9;
      z-index: 1;
    }
    .chip::after {
      content: '';
      position: absolute;
      inset: 9px;
      border-radius: 50%;
      border: 2px dashed rgba(255,255,255,0.45);
    }
    .chip1 { top: 7%; left: 4%; transform: rotate(-18deg); }
    .chip2 { top: 12%; right: 6%; transform: rotate(22deg); width: 48px; height: 48px; }
    .chip3 { bottom: 22%; left: 6%; transform: rotate(12deg); width: 42px; height: 42px; }
    .chip4 { bottom: 16%; right: 5%; transform: rotate(-20deg); width: 52px; height: 52px; }

    .content {
      position: relative;
      z-index: 10;
      max-width: 400px;
      width: 100%;
    }

    .badge {
      display: inline-block;
      background: rgba(0,0,0,0.28);
      padding: 7px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.4px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(21px, 5.8vw, 26px);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 6px;
      text-transform: uppercase;
      text-shadow: 0 3px 12px rgba(0,0,0,0.35);
    }

    .gold {
      background: linear-gradient(180deg, #ffe57f 0%, #ffb300 45%, #ff6f00 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-size: clamp(34px, 9.5vw, 44px);
      font-weight: 900;
      line-height: 1.05;
      margin: 4px 0 22px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .subtitle {
      font-size: 15px;
      line-height: 1.45;
      opacity: 0.95;
      margin-bottom: 30px;
    }

    /* Botón verde con logo WhatsApp */
    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #25D366;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      padding: 17px 32px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.5);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      width: 100%;
      max-width: 300px;
      text-decoration: none;
    }

    .cta-btn:active {
      transform: scale(0.97);
      box-shadow: 0 4px 14px rgba(37, 211, 102, 0.4);
    }

    .cta-btn svg {
      width: 26px;
      height: 26px;
      flex-shrink: 0;
    }

    .note {
      margin-top: 20px;
      font-size: 13px;
      opacity: 0.88;
    }

    .domain {
      margin-top: 28px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0.9;
      letter-spacing: 0.3px;
    }

    /* Ocultar el botón flotante de Kommo */
    #crm_plugin_button,
    .crm-button,
    [class*="crm-button"],
    [id*="crm_plugin"],
    .amo-button,
    iframe[src*="kommo"],
    div[id^="crm"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }
  </style>
</head>
<body>

  <div class="chip chip1"></div>
  <div class="chip chip2"></div>
  <div class="chip chip3"></div>
  <div class="chip chip4"></div>

  <div class="content">
    <div class="badge">CASINO ONLINE • 24HS</div>

    <h1>Con tu primera carga<br>pedí tu</h1>
    <div class="gold">BONO DE<br>REGALO</div>

    <p class="subtitle">
      Escribime y te ayudo a acreditar tus fichas<br>
      con el bono incluido.
    </p>

    <!-- Único botón visible -->
    <button class="cta-btn" onclick="abrirChat()">
      <!-- Logo WhatsApp -->
      <svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <path fill="#ffffff" d="M16.004 0h-.008C7.174 0 0 7.176 0 16.004c0 2.82.738 5.584 2.14 8.012L.14 30.4l6.54-1.714A15.96 15.96 0 0016.004 32C24.83 32 32 24.822 32 15.996 32 7.176 24.83 0 16.004 0zm9.29 22.57c-.39.1-2.25 1.11-2.6 1.24-.35.13-.68.2-1.02-.1-.34-.29-1.44-1.33-1.76-1.51-.32-.19-.62-.2-.92.1-.3.29-1.15 1.14-1.41 1.38-.26.24-.52.25-.96.09-.44-.17-1.86-.69-3.54-2.19-1.31-1.17-2.19-2.61-2.45-3.05-.26-.44-.03-.68.19-.9.2-.19.44-.5.66-.74.22-.25.29-.42.44-.7.14-.29.07-.54-.04-.75-.1-.2-.92-2.21-1.26-3.03-.33-.79-.67-.68-.92-.69h-.78c-.26 0-.68.1-1.04.49-.35.39-1.36 1.33-1.36 3.24s1.39 3.76 1.58 4.02c.2.26 2.73 4.17 6.62 5.85 3.89 1.67 3.89 1.11 4.59 1.04.7-.07 2.25-.92 2.57-1.81.32-.89.32-1.65.22-1.81-.09-.16-.34-.26-.73-.45z"/>
      </svg>
      Escribime acá!
    </button>

    <p class="note">Atención personalizada • Respuesta rápida</p>
    <p class="domain">www.ganamos.net</p>
  </div>

  <!-- Kommo Widget (invisible) -->
  <script>
    (function(a,m,o,c,r,m){
      a[m]={
        id:"1078895",
        hash:"7afe8c661ae21b1eb55f38b542603609f977ea292469fbd2b5cb0cf03380b008",
        locale:"es",
        setMeta:function(p){this.params=(this.params||[]).concat([p])}
      };
      a[o]=a[o]||function(){(a[o].q=a[o].q||[]).push(arguments)};
      var d=a.document,s=d.createElement('script');
      s.async=true;
      s.id=m+'_script';
      s.src='https://gso.kommo.com/js/button.js';
      d.head&&d.head.appendChild(s)
    }(window,0,'crmPlugin',0,0,'crm_plugin'));
  </script>

  <script>
    // Evento Contact
    setTimeout(function() {
      if (typeof fbq === 'function') fbq('track', 'Contact');
    }, 2500);

    function abrirChat() {
      try {
        if (typeof crmPlugin === 'function') {
          crmPlugin('runChatShow');
        }
      } catch (e) {}

      setTimeout(function() {
        try { crmPlugin('runChatShow'); } catch(e) {}
      }, 500);

      setTimeout(function() {
        try { crmPlugin('runChatShow'); } catch(e) {}
      }, 1200);
    }

    // Ocultar el botón de Kommo si aparece
    setInterval(function() {
      var els = document.querySelectorAll('#crm_plugin_button, .crm-button, [class*="crm-button"], [id*="crm_plugin"], .amo-button');
      els.forEach(function(el) {
        el.style.display = 'none';
        el.style.visibility = 'hidden';
        el.style.opacity = '0';
        el.style.pointerEvents = 'none';
      });
    }, 500);
  </script>

</body>
</html>
