<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GANAMOS - Bono de Regalo</title>

  <!-- Facebook Pixel -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1993981097970015');
    fbq('track', 'PageView');
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0a0015;
    }
    .wrapper {
      position: relative;
      width: 100%; height: 100%;
      max-width: 480px;
      margin: 0 auto;
    }
    .promo {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .cta-text {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 14%;
      z-index: 50;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,0.7);
      width: 90%;
    }
    .wa-btn {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 5.5%;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #25D366;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 17px;
      font-weight: 700;
      padding: 15px 28px;
      border-radius: 50px;
      border: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(37, 211, 102, 0.55);
      width: 78%;
      max-width: 300px;
      -webkit-tap-highlight-color: transparent;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .wa-btn:active { transform: translateX(-50%) scale(0.97); }
    .wa-btn img { width: 26px; height: 26px; display: block; flex-shrink: 0; }
    @keyframes pulse {
      0%   { transform: translateX(-50%) scale(1);    box-shadow: 0 8px 24px rgba(37,211,102,0.45); }
      50%  { transform: translateX(-50%) scale(1.06); box-shadow: 0 12px 32px rgba(37,211,102,0.75); }
      100% { transform: translateX(-50%) scale(1);    box-shadow: 0 8px 24px rgba(37,211,102,0.45); }
    }
    /* Por si acaso sigue apareciendo el botón de Kommo */
    .amo-button-holder,
    #crm_plugin_button {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
      visibility: hidden !important;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <img src="promo.jpeg" alt="Bono de Regalo" class="promo">
    <p class="cta-text">Tocá el botón para hablar por WhatsApp</p>
    <button class="wa-btn" id="btnChat" type="button">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" alt="WhatsApp" width="26" height="26">
      Escribime acá!
    </button>
  </div>

  <!-- IMPORTANTE: config ANTES del script de Kommo -->
  <script>
    window.crmPluginConfig = {
      hidden: true
    };
  </script>

  <!-- Script de Kommo -->
  <script>
    (function(a,m,o,c,r,m){
      a[m]={
        id:"1078895",
        hash:"7afe8c661ae21b1eb55f38b542603609f977ea292469fbd2b5cb0cf03380b008",
        locale:"es",
        setMeta:function(p){this.params=(this.params||[]).concat([p])}
      };
      a[o]=a[o]||function(){(a[o].q=a[o].q||[]).push(arguments)};
      var d=a.document,s=d.createElement('script');
      s.async=true;
      s.id=m+'_script';
      s.src='https://gso.kommo.com/js/button.js';
      d.head&&d.head.appendChild(s)
    }(window,0,'crmPlugin',0,0,'crm_plugin'));
  </script>

  <script>
    setTimeout(function() {
      if (typeof fbq === 'function') fbq('track', 'Contact');
    }, 2500);

    function openChat() {
      try {
        if (typeof crmPlugin === 'function') {
          crmPlugin('runChatShow');
        }
      } catch (e) {}
    }

    // Cuando el chat esté listo, el botón ya puede abrirlo
    document.getElementById('btnChat').addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      openChat();
      // reintento por si todavía no cargó
      setTimeout(openChat, 400);
      setTimeout(openChat, 1000);
    });
  </script>

</body>
</html>
