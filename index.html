<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atención al Cliente</title>

  <!-- Facebook Pixel -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    
    fbq('init', '1993981097970015');
    fbq('track', 'PageView');
  </script>
  <noscript>
    <img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1993981097970015&ev=PageView&noscript=1"/>
  </noscript>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: #f0f2f5;
    }
  </style>
</head>
<body>

  <!-- Widget Kommo -->
  <script>
    (function(a,m,o,c,r,m){
      a[m]={
        id:"1078895",
        hash:"7afe8c661ae21b1eb55f38b542603609f977ea292469fbd2b5cb0cf03380b008",
        locale:"es",
        setMeta:function(p){this.params=(this.params||[]).concat([p])}
      };
      a[o]=a[o]||function(){(a[o].q=a[o].q||[]).push(arguments)};
      var d=a.document,s=d.createElement('script');
      s.async=true;
      s.id=m+'_script';
      s.src='https://gso.kommo.com/js/button.js';
      d.head&&d.head.appendChild(s)
    }(window,0,'crmPlugin',0,0,'crm_plugin'));
  </script>

  <script>
    let contactFired = false;

    function openChat() {
      try {
        if (typeof crmPlugin === 'function') {
          crmPlugin('runChatShow');
          return true;
        }
      } catch (e) {}
      return false;
    }

    // Forzar apertura del chat
    const forceOpen = setInterval(function() {
      openChat();
    }, 250);

    setTimeout(function() {
      clearInterval(forceOpen);
    }, 10000);

    // Disparar Contact cuando se abre el chat
    function setupTracking() {
      try {
        if (typeof crmPlugin === 'function') {
          crmPlugin('onChatShow', function() {
            if (!contactFired) {
              fbq('track', 'Contact');
              contactFired = true;
              console.log('Evento Contact disparado');
            }
          });
        }
      } catch (e) {}
    }

    // Intentar configurar el tracking varias veces
    setTimeout(setupTracking, 800);
    setTimeout(setupTracking, 1500);
    setTimeout(setupTracking, 2500);
    setTimeout(setupTracking, 4000);

    window.addEventListener('load', function() {
      openChat();
      setTimeout(openChat, 200);
      setTimeout(openChat, 500);
      setTimeout(openChat, 1000);
    });
  </script>

</body>
</html>
