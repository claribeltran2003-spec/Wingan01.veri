<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>GANAMOS - Bono de Regalo</title>


  <!-- =====================================================
       FACEBOOK PIXEL
  ====================================================== -->

  <script>
    !function(f,b,e,v,n,t,s)
    {
      if(f.fbq)return;

      n=f.fbq=function(){
        n.callMethod ?
        n.callMethod.apply(n,arguments) :
        n.queue.push(arguments)
      };

      if(!f._fbq)f._fbq=n;

      n.push=n;
      n.loaded=!0;
      n.version='2.0';
      n.queue=[];

      t=b.createElement(e);
      t.async=!0;
      t.src=v;

      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s);

    }(
      window,
      document,
      'script',
      'https://connect.facebook.net/en_US/fbevents.js'
    );

  <noscript>

    <img
      height="1"
      width="1"
      style="display:none"
      src="https://www.facebook.com/tr?id=1993981097970015&ev=PageView&noscript=1"
    />

  </noscript>


  <!-- =====================================================
       KOMMO CONFIG
  ====================================================== -->

  <script>

    window.crmPluginConfig = {

      hidden: true,

      onlinechat: {

        mode: "widget",

        locale: {
          extends: "es"
        }

      }

    };

  </script>


  <!-- =====================================================
       CSS OFICIAL DE KOMMO
  ====================================================== -->

  <link
    rel="stylesheet"
    href="https://gso.kommo.com/build/css/index.css"
  >


  <!-- =====================================================
       ESTILOS
  ====================================================== -->

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #0a0015;

    }


    .wrapper {

      position: relative;

      width: 100%;
      height: 100%;

      max-width: 480px;

      margin: 0 auto;

    }


    .promo {

      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position: center top;

      display: block;

    }


    /* =====================================================
       TEXTO
    ====================================================== */

    .cta-text {

      position: absolute;

      left: 50%;

      transform: translateX(-50%);

      bottom: 14%;

      z-index: 50;

      width: 90%;

      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 14px;

      font-weight: 600;

      text-align: center;

      letter-spacing: 0.2px;

      text-shadow:
        0 2px 8px rgba(0,0,0,0.7);

    }


    /* =====================================================
       BOTÓN VERDE
    ====================================================== */

    .wa-btn {

      position: absolute;

      left: 50%;

      transform: translateX(-50%);

      bottom: 5.5%;

      z-index: 50;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      width: 78%;

      max-width: 300px;

      padding: 15px 28px;

      background: #25D366;

      color: #fff;

      text-decoration: none;

      border: none;

      border-radius: 50px;

      cursor: pointer;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 17px;

      font-weight: 700;

      box-shadow:
        0 8px 24px rgba(37, 211, 102, 0.55);

      -webkit-tap-highlight-color: transparent;

      animation:
        pulse 1.6s ease-in-out infinite;

    }


    .wa-btn:active {

      transform:
        translateX(-50%)
        scale(0.97);

    }


    .wa-btn img {

      width: 26px;

      height: 26px;

      display: block;

      flex-shrink: 0;

    }


    /* =====================================================
       ANIMACIÓN
    ====================================================== */

    @keyframes pulse {

      0% {

        transform:
          translateX(-50%)
          scale(1);

        box-shadow:
          0 8px 24px rgba(37, 211, 102, 0.45);

      }

      50% {

        transform:
          translateX(-50%)
          scale(1.06);

        box-shadow:
          0 12px 32px rgba(37, 211, 102, 0.75);

      }

      100% {

        transform:
          translateX(-50%)
          scale(1);

        box-shadow:
          0 8px 24px rgba(37, 211, 102, 0.45);

      }

    }


    /* =====================================================
       CONTENEDOR DEL CHAT
    ====================================================== */

    #kommoChatFrame {

      position: fixed;

      inset: 0;

      width: 100vw;

      height: 100vh;

      z-index: 99999;

      display: none;

      background: transparent;

    }


    #kommoChatFrame.active {

      display: block;

    }


    /* =====================================================
       ESTRUCTURA IGUAL A KOMMO
    ====================================================== */

    #kommoChatFrame .amo-livechat {

      position: fixed !important;

      inset: 0 !important;

      width: 100vw !important;

      height: 100vh !important;

      z-index: 100000 !important;

      display: block !important;

      visibility: visible !important;

      opacity: 1 !important;

      background: none !important;

    }


    #kommoChatFrame .amo-livechat_hidden {

      display: block !important;

      visibility: visible !important;

      opacity: 1 !important;

    }


    #kommoChatFrame .amo-livechat_frame {

      display: block !important;

      visibility: visible !important;

      opacity: 1 !important;

    }


    /* =====================================================
       IFRAME
    ====================================================== */

    #kommoChatFrame iframe {

      display: block !important;

      visibility: visible !important;

      opacity: 1 !important;

      position: fixed !important;

      top: 0 !important;

      right: 0 !important;

      bottom: 0 !important;

      left: 0 !important;

      width: 100vw !important;

      height: 100vh !important;

      border: 0 !important;

      margin: 0 !important;

      padding: 0 !important;

      z-index: 100001 !important;

      background: #fff !important;

    }


    /* =====================================================
       CERRAR
    ====================================================== */

    #kommoClose {

      position: fixed;

      top: 12px;

      right: 12px;

      z-index: 100002;

      width: 42px;

      height: 42px;

      border: none;

      border-radius: 50%;

      background: rgba(0,0,0,.6);

      color: #fff;

      font-size: 28px;

      line-height: 42px;

      text-align: center;

      cursor: pointer;

      display: none;

    }


    #kommoChatFrame.active ~ #kommoClose {

      display: block;

    }


    /* =====================================================
       OCULTAR BOTÓN FLOTANTE DE KOMMO
    ====================================================== */

    .amo-button-holder,

    .amo-horisontal,

    #crm_plugin,

    [id="crm_plugin"],

    [id="crm_plugin_script"] {

      display: none !important;

      visibility: hidden !important;

      opacity: 0 !important;

      pointer-events: none !important;

    }

  </style>

</head>


<body>


  <!-- =====================================================
       LANDING
  ====================================================== -->

  <div class="wrapper">


    <img
      src="promo.jpeg"
      alt="Bono de Regalo"
      class="promo"
    >


    <p class="cta-text">
      Tocá el botón para hablar por WhatsApp
    </p>


    <!-- ===================================================
         BOTÓN
    ==================================================== -->

    <a
      href="#"
      class="wa-btn"
      id="btnChat"
    >

      <img
        src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
        alt="WhatsApp"
        width="26"
        height="26"
      >

      Escribime acá!

    </a>

  </div>


  <!-- =====================================================
       CHAT
  ====================================================== -->

  <div
    id="kommoChatFrame"
    aria-hidden="true"
  >
  </div>


  <!-- =====================================================
       CERRAR
  ====================================================== -->

  <button
    id="kommoClose"
    type="button"
    aria-label="Cerrar chat"
  >
    ×
  </button>


  <!-- =====================================================
       KOMMO
  ====================================================== -->

  <script>

    (function(a,m,o,c,r,m){

      a[m] = {

        id: "1078895",

        hash:
          "7afe8c661ae21b1eb55f38b542603609f977ea292469fbd2b5cb0cf03380b008",

        locale: "es",

        setMeta: function(p){

          this.params =
            (this.params || []).concat([p]);

        }

      };


      a[o] = a[o] || function(){

        (a[o].q = a[o].q || []).push(arguments);

      };


      var d = a.document;

      var s = d.createElement("script");

      s.async = true;

      s.id = m + "_script";

      s.src =
        "https://gso.kommo.com/js/button.js";


      d.head.appendChild(s);


    }(
      window,
      0,
      "crmPlugin",
      0,
      0,
      "crm_plugin"
    ));

  </script>


  <!-- =====================================================
       CONTROL
  ====================================================== -->

  <script>

    var btnChat =
      document.getElementById(
        "btnChat"
      );


    var chatFrame =
      document.getElementById(
        "kommoChatFrame"
      );


    var closeButton =
      document.getElementById(
        "kommoClose"
      );


    /*
     * Busca el iframe que Kommo
     * genera automáticamente.
     */

    function encontrarIframeKommo() {

      var iframe =
        document.querySelector(
          'iframe[title="Kommo Live Chat"]'
        );


      if (
        !iframe
      ) {

        return null;

      }


      return iframe;

    }


    /*
     * Crea nuestra estructura
     * usando el iframe de TU Kommo.
     */

    function prepararChat() {

      var iframe =
        encontrarIframeKommo();


      if (
        !iframe
      ) {

        return false;

      }


      /*
       * Evitamos duplicarlo.
       */

      if (
        chatFrame.querySelector("iframe")
      ) {

        return true;

      }


      /*
       * Obtenemos la URL que Kommo
       * generó para TU cuenta.
       */

      var src =
        iframe.getAttribute("src");


      if (
        !src
      ) {

        return false;

      }


      /*
       * Creamos exactamente la
       * estructura que vimos en
       * Activos Black.
       */

      var livechat =
        document.createElement("div");


      livechat.id =
        "amo-livechat";


      livechat.className =
        "amo-livechat amo-livechat_frame amo-livechat--no-mobile";


      livechat.style.background =
        "none";


      /*
       * Creamos iframe nuevo usando
       * la URL de TU Kommo.
       */

      var nuevoIframe =
        document.createElement("iframe");


      nuevoIframe.title =
        "Kommo Live Chat";


      nuevoIframe.name =
        "amo-livechat-iframe-custom";


      nuevoIframe.src =
        src;


      livechat.appendChild(
        nuevoIframe
      );


      chatFrame.appendChild(
        livechat
      );


      console.log(
        "Chat Kommo preparado:",
        src
      );


      return true;

    }


    /*
     * BOTÓN VERDE
     */

    btnChat.addEventListener(
      "click",
      function(e) {

        e.preventDefault();

        e.stopPropagation();


        /*
         * Pixel
         */

        if (
          typeof fbq === "function"
        ) {

          fbq(
            "track",
            "Contact"
          );

        }


        /*
         * Si ya tenemos iframe,
         * lo mostramos.
         */

        if (
          prepararChat()
        ) {

          chatFrame.classList.add(
            "active"
          );

          chatFrame.setAttribute(
            "aria-hidden",
            "false"
          );

          return;

        }


        /*
         * Si todavía no fue creado,
         * hacemos que Kommo inicialice
         * el widget.
         */

        if (
          typeof crmPlugin === "function"
        ) {

          try {

            crmPlugin(
              "runChatShow"
            );

          } catch(error) {

            console.log(
              "Kommo:",
              error
            );

          }

        }


        /*
         * Esperamos a que Kommo
         * genere su iframe.
         */

        var intentos = 0;


        var espera =
          setInterval(
            function() {

              intentos++;


              if (
                prepararChat()
              ) {

                clearInterval(
                  espera
                );


                chatFrame.classList.add(
                  "active"
                );


                chatFrame.setAttribute(
                  "aria-hidden",
                  "false"
                );


                console.log(
                  "CHAT KOMMO ABIERTO"
                );

              }


              if (
                intentos >= 50
              ) {

                clearInterval(
                  espera
                );


                console.log(
                  "No se encontró el iframe de Kommo."
                );

              }

            },
            200
          );

      }
    );


    /*
     * CERRAR
     */

    closeButton.addEventListener(
      "click",
      function() {

        chatFrame.classList.remove(
          "active"
        );


        chatFrame.setAttribute(
          "aria-hidden",
          "true"
        );

      }
    );


    /*
     * Intentamos preparar Kommo
     * automáticamente después de
     * cargar la página.
     */

    var inicio = 0;


    var esperarInicio =
      setInterval(
        function() {

          inicio++;


          if (
            prepararChat()
          ) {

            clearInterval(
              esperarInicio
            );

          }


          if (
            inicio >= 50
          ) {

            clearInterval(
              esperarInicio
            );

          }

        },
        300
      );

  </script>


</body>

</html>
