<!DOCTYPE html>
<html lang="es">

       KOMMO CONFIG
       ESTA ES LA PARTE CLAVE

        container: '#kommoChatFrame',

        locale: {
          extends: 'es',
          compose_placeholder: 'Escribí tu mensaje...'
        }

      }

    };

  </script>


  <!-- =====================================================
       META PIXEL
  ====================================================== -->

      };

    <img

  <!-- =====================================================
       ESTILOS
  ====================================================== -->

  <style>

    :root {

      --btn-color: #25D366;

      --btn-text: #ffffff;

      --btn-hover: #1ebe5d;

      --btn-color-rgb: 37, 211, 102;

      --chat-w: 420px;

      --chat-gap: 16px;

      --chat-radius: 18px;

      --chat-border:
        rgba(255,255,255,.18);

      --chat-bg:
        rgba(0,0,0,.55);

      --chat-shadow:
        0 20px 70px rgba(0,0,0,.55);

    }


    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }


    html,
    body {

      width: 100%;

      height: 100%;

      margin: 0;

      padding: 0;

      overflow: hidden;

      background: #0a0015;

    }


    body {

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background-color: #0a0015;

    }


    /* =====================================================
       LANDING
    ====================================================== */

    .wrapper {

      position: relative;

      width: 100%;

      height: 100%;

      max-width: 480px;

      margin: 0 auto;

      display: flex;

      justify-content: center;

      align-items: flex-end;

      padding-bottom: 5.5vh;

    }


    .promo {

      position: absolute;

      inset: 0;

      width: 100%;

      height: 100%;

      object-fit: cover;

      object-position: center top;

      display: block;

      z-index: 1;

    }


    /* =====================================================
       TEXTO
    ====================================================== */

    .cta-text {

      position: absolute;

      left: 50%;

      bottom: 14%;

      transform:
        translateX(-50%);

      width: 90%;

      z-index: 10;

      color: #fff;

      font-size: 14px;

      font-weight: 600;

      text-align: center;

      letter-spacing: .2px;

      text-shadow:
        0 2px 8px rgba(0,0,0,.7);

    }


    /* =====================================================
       BOTÓN VERDE
    ====================================================== */

    .cta-btn {

      position: relative;

      z-index: 10;

      background:
        var(--btn-color);

      color:
        var(--btn-text);

      border: none;

      padding: 15px 28px;

      width: 78%;

      max-width: 300px;

      border-radius: 999px;

      font-weight: 700;

      font-size: 17px;

      text-decoration: none;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      cursor: pointer;

      white-space: nowrap;

      box-shadow:
        0 8px 24px
        rgba(37,211,102,.55);

      -webkit-tap-highlight-color:
        transparent;

      animation:
        pulse 1.8s infinite;

    }


    .cta-btn:hover {

      background:
        var(--btn-hover);

    }


    .cta-btn:active {

      transform:
        scale(.97);

    }


    .cta-btn img {

      width: 26px;

      height: 26px;

      display: block;

    }


    @keyframes pulse {

      0% {

        transform: scale(1);

        box-shadow:
          0 8px 24px
          rgba(37,211,102,.45);

      }

      70% {

        transform: scale(1.05);

        box-shadow:
          0 0 0 12px
          rgba(37,211,102,0);

      }

      100% {

        transform: scale(1);

        box-shadow:
          0 8px 24px
          rgba(37,211,102,.45);

      }

    }


    /* =====================================================
       CHAT KOMMO
       MISMA ESTRUCTURA QUE ACTIBOS BLACK
    ====================================================== */

    #kommoChatFrame {

      position: fixed;

      top: var(--chat-gap);

      right: var(--chat-gap);

      width: var(--chat-w);

      height:
        calc(
          100vh -
          (var(--chat-gap) * 2)
        );

      border-radius:
        var(--chat-radius);

      z-index: 9999;

      visibility: hidden;

      opacity: 0;

      background: transparent;

      border:
        1px solid transparent;

      box-shadow: none;

      backdrop-filter: none;

      transform:
        translateY(15px);

      transition:
        opacity .3s ease,
        transform .3s ease,
        background .4s ease;

      overflow: hidden;

      pointer-events: none;

    }


    #kommoChatFrame.is-open {

      visibility: visible;

      opacity: 1;

      transform:
        translateY(0);

      background:
        var(--chat-bg);

      backdrop-filter:
        blur(10px);

      border:
        1px solid
        var(--chat-border);

      box-shadow:
        var(--chat-shadow);

      pointer-events: auto;

    }


    /* =====================================================
       EL IFRAME GENERADO POR KOMMO
    ====================================================== */

    #kommoChatFrame iframe {

      width: 100% !important;

      height: 100% !important;

      border: 0 !important;

    }


    /* =====================================================
       BOTÓN CERRAR
    ====================================================== */

    #kommoClose {

      position: fixed;

      top:
        calc(
          var(--chat-gap) + 10px
        );

      right:
        calc(
          var(--chat-gap) + 10px
        );

      z-index: 10000;

      width: 42px;

      height: 42px;

      border-radius: 50%;

      border:
        1px solid
        rgba(255,255,255,.14);

      background:
        rgba(0,0,0,.45);

      color: #fff;

      display: none;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      backdrop-filter:
        blur(10px);

    }


    #kommoClose.is-open {

      display: flex;

    }


    #kommoClose svg {

      width: 18px;

      height: 18px;

      opacity: .9;

    }


    /* =====================================================
       OCULTAR BOTÓN FLOTANTE DE KOMMO
    ====================================================== */

    .amo-button-holder {

      display: none !important;

      visibility: hidden !important;

      opacity: 0 !important;

      pointer-events: none !important;

    }


    .amo-button {

      display: none !important;

    }


    /* =====================================================
       MOBILE
    ====================================================== */

    @media (max-width: 768px) {

      .cta-btn {

        font-size: 17px;

        padding: 15px 24px;

        width: 78%;

        max-width: 300px;

      }


      #kommoChatFrame {

        top: 0;

        right: 0;

        width: 100vw;

        height: 100vh;

        height: 100dvh;

        border-radius: 0;

        border: none;

        background:
          rgba(0,0,0,.88);

        backdrop-filter: none;

      }


      #kommoClose {

        top: 12px;

        right: 12px;

        background:
          rgba(0,0,0,.6);

      }

    }

  </style>

</head>


<body>


  <!-- =====================================================
       LANDING
  ====================================================== -->

  <div class="wrapper">


    <img
      src="promo.jpeg"
      class="promo"
      alt="Bono de Regalo"
    >


    <p class="cta-text">

      Tocá el botón para hablar por WhatsApp

    </p>


    <a
      href="#"
      class="cta-btn"
      id="botonKommo"
    >

      <img
        src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
        alt="WhatsApp"
      >

      <span>
        Escribime aca!
      </span>

    </a>


    <!-- ===================================================
         CONTENEDOR QUE KOMMO UTILIZA
    ==================================================== -->

    <div
      id="kommoChatFrame"
      aria-hidden="true"
    ></div>


    <!-- ===================================================
         CERRAR CHAT
    ==================================================== -->

    <button
      id="kommoClose"
      type="button"
      aria-label="Cerrar chat"
    >

      <svg
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >

        <path
          d="M6 6l12 12M18 6L6 18"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        />

      </svg>

    </button>

  </div>


  <!-- =====================================================
       KOMMO
       
       TUS DATOS
    ====================================================== -->

  <script>

    (function(
      a,
      m,
      o,
      c,
      r,

        setMeta: function(p){

          this.params =
            (this.params || [])
              .concat([p]);

        }

      };


      a[o] =
        a[o] ||
        function(){

          (
            a[o].q =
            a[o].q || []
          ).push(arguments);

        };


      var d =
        a.document;


      var s =
        d.createElement('script');

    ));

  <!-- =====================================================
       CONTROL DEL CHAT
       
       BASADO EN EL CÓDIGO DE LA LANDING
       QUE SÍ FUNCIONA
  ====================================================== -->

  <script>

    (function(){


      const frame =
        document.getElementById(
          'kommoChatFrame'
        );


      const closeBtn =
        document.getElementById(
          'kommoClose'
        );


      const kommoBtn =
        document.getElementById(
          'botonKommo'
        );


      let chatReady = false;

      let pendingOpen = false;


      /* ===============================================
         ABRIR CHAT
      =============================================== */

      function doOpen(){

        if (!frame)
          return;


        frame.classList.add(
          'is-open'
        );


        frame.setAttribute(
          'aria-hidden',
          'false'
        );


        if (closeBtn){

          closeBtn.classList.add(
            'is-open'
          );

        }


        try {

          if (
            typeof crmPlugin ===
            'function'
          ){

            crmPlugin(
              'runChatShow'
            );

          }

        }
        catch (_) {}


        /* META */

        try {

          if (
            typeof fbq ===
            'function'
          ){

            fbq(
              'track',
              'Contact'
            );


            fbq(
              'trackCustom',
              'ClickBotonKommo'
            );

          }

        }
        catch (_) {}

      }


      /* ===============================================
         CLICK BOTÓN
      =============================================== */

      function openChat(ev){

        if (ev)
          ev.preventDefault();


        /*
         * Si Kommo ya está listo,
         * abrimos inmediatamente.
         */

        if (chatReady){

          doOpen();

          return;

        }


        /*
         * Si todavía no está listo,
         * guardamos el clic.
         */

        pendingOpen = true;

      }


      /* ===============================================
         CERRAR
      =============================================== */

      function closeChat(){

        if (!frame)
          return;


        frame.classList.remove(
          'is-open'
        );


        frame.setAttribute(
          'aria-hidden',
          'true'
        );


        if (closeBtn){

          closeBtn.classList.remove(
            'is-open'
          );

        }


        try {

          if (
            typeof crmPlugin ===
            'function'
          ){

            crmPlugin(
              'runChatHide'
            );

          }

        }
        catch (_) {}

      }


      /* ===============================================
         ESPERAR KOMMO
      =============================================== */

      function bindKommo(){

        if (
          typeof crmPlugin !==
          'function'
        ){

          setTimeout(
            bindKommo,
            100
          );

          return;

        }


        crmPlugin(
          'onChatReady',
          function(){

            chatReady = true;


            /*
             * Si la persona tocó el botón
             * antes de que Kommo terminara
             * de cargar, abrimos ahora.
             */

            if (pendingOpen){

              pendingOpen = false;

              doOpen();

            }

          }
        );


        /* =========================================
           KOMMO OCULTÓ CHAT
        ========================================== */

        crmPlugin(
          'onChatHide',
          function(){

            if (frame){

              frame.classList.remove(
                'is-open'
              );

            }


            if (closeBtn){

              closeBtn.classList.remove(
                'is-open'
              );

            }

          }
        );


        /* =========================================
           KOMMO MOSTRÓ CHAT
        ========================================== */

        crmPlugin(
          'onChatShow',
          function(){

            if (frame){

              frame.classList.add(
                'is-open'
              );

              frame.setAttribute(
                'aria-hidden',
                'false'
              );

            }


            if (closeBtn){

              closeBtn.classList.add(
                'is-open'
              );

            }

          }
        );

      }


      /* ===============================================
         EVENTOS
      =============================================== */

      if (kommoBtn){

        kommoBtn.addEventListener(
          'click',
          openChat
        );

      }


      if (closeBtn){

        closeBtn.addEventListener(
          'click',
          closeChat
        );

      }


      document.addEventListener(
        'keydown',
        function(ev){

          if (
            ev.key === 'Escape'
          ){

            closeChat();

          }

        }
      );


      /* ===============================================
         INICIAR
      =============================================== */

      bindKommo();


    })();

  </script>


</body>

</html>
