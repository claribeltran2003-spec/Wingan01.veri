<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>GANAMOS - Bono de Regalo</title>


  <!-- =====================================================
       META PIXEL
  ====================================================== -->

  <script>
    !function(f,b,e,v,n,t,s)
    {
      if(f.fbq)return;

      n=f.fbq=function(){
        n.callMethod ?
        n.callMethod.apply(n,arguments) :
        n.queue.push(arguments)
      };

      if(!f._fbq)f._fbq=n;

      n.push=n;
      n.loaded=!0;
      n.version='2.0';
      n.queue=[];

      t=b.createElement(e);
      t.async=!0;
      t.src=v;

      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s);

    }(
      window,
      document,
      'script',
      'https://connect.facebook.net/en_US/fbevents.js'
    );

    fbq('init', '1993981097970015');
    fbq('track', 'PageView');
  </script>


  <noscript>
    <img
      height="1"
      width="1"
      style="display:none"
      src="https://www.facebook.com/tr?id=1993981097970015&ev=PageView&noscript=1"
    >
  </noscript>


  <!-- =====================================================
       KOMMO CONFIGURACIÓN
  ====================================================== -->

  <script>

    window.crmPluginConfig = {

      hidden: true,

      onlinechat: {

        mode: "widget",

        locale: {
          extends: "es"
        }

      }

    };

  </script>


  <!-- =====================================================
       KOMMO SCRIPT
  ====================================================== -->

  <script
    async
    id="crm_plugin_script"
    src="https://gso.kommo.com/js/button.js">
  </script>


  <!-- =====================================================
       CSS DE KOMMO
  ====================================================== -->

  <link
    rel="stylesheet"
    href="https://gso.kommo.com/build/css/index.css?f4Z6G1mL4LI9f_2kboV0x"
  >


  <!-- =====================================================
       ESTILOS LANDING
  ====================================================== -->

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #0a0015;

    }


    .wrapper {

      position: relative;

      width: 100%;
      height: 100%;

      max-width: 480px;

      margin: 0 auto;

    }


    .promo {

      width: 100%;
      height: 100%;

      object-fit: cover;

      object-position: center top;

      display: block;

    }


    /* =====================================================
       TEXTO
    ====================================================== */

    .cta-text {

      position: absolute;

      left: 50%;

      bottom: 14%;

      transform:
        translateX(-50%);

      width: 90%;

      z-index: 100;

      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 14px;

      font-weight: 600;

      text-align: center;

      letter-spacing: .2px;

      text-shadow:
        0 2px 8px rgba(0,0,0,.7);

    }


    /* =====================================================
       BOTÓN VERDE
    ====================================================== */

    .cta-btn {

      position: absolute;

      left: 50%;

      bottom: 5.5%;

      transform:
        translateX(-50%);

      z-index: 100;

      display: flex;

      align-items: center;

      justify-content: center;

      gap: 10px;

      width: 78%;

      max-width: 300px;

      padding: 15px 28px;

      background: #25D366;

      color: #fff;

      text-decoration: none;

      border: none;

      border-radius: 50px;

      cursor: pointer;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      font-size: 17px;

      font-weight: 700;

      box-shadow:
        0 8px 24px
        rgba(37,211,102,.55);

      -webkit-tap-highlight-color:
        transparent;

      animation:
        pulse 1.6s ease-in-out infinite;

    }


    .cta-btn:active {

      transform:
        translateX(-50%)
        scale(.97);

    }


    .cta-btn img {

      width: 26px;

      height: 26px;

      display: block;

      flex-shrink: 0;

    }


    /* =====================================================
       NO MOSTRAR "CARGANDO"
       
       Kommo no debe bloquear nuestro botón.
    ====================================================== */

    .btn-loading {

      display: none !important;

    }


    .btn-label {

      display: inline !important;

    }


    /* =====================================================
       ANIMACIÓN
    ====================================================== */

    @keyframes pulse {

      0% {

        transform:
          translateX(-50%)
          scale(1);

        box-shadow:
          0 8px 24px
          rgba(37,211,102,.45);

      }

      50% {

        transform:
          translateX(-50%)
          scale(1.06);

        box-shadow:
          0 12px 32px
          rgba(37,211,102,.75);

      }

      100% {

        transform:
          translateX(-50%)
          scale(1);

        box-shadow:
          0 8px 24px
          rgba(37,211,102,.45);

      }

    }


    /* =====================================================
       OCULTAR BOTÓN FLOTANTE NATIVO DE KOMMO
    ====================================================== */

    .amo-button-holder {

      display: none !important;

      visibility: hidden !important;

      opacity: 0 !important;

      pointer-events: none !important;

    }


    /* =====================================================
       OCULTAR POSIBLES BOTONES FLOTANTES DE KOMMO
    ====================================================== */

    .amo-button {

      display: none !important;

    }


    .amo-button-holder.amo-horisontal {

      display: none !important;

    }

  </style>

</head>


<body>


  <!-- =====================================================
       LANDING
  ====================================================== -->

  <div class="wrapper">


    <img
      src="promo.jpeg"
      class="promo"
      alt="Bono de Regalo"
    >


    <p class="cta-text">
      Tocá el botón para hablar por WhatsApp
    </p>


    <!-- ===================================================
         BOTÓN
    ==================================================== -->

    <a
      href="#"
      class="cta-btn"
      id="botonKommo"
    >

      <img
        src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg"
        alt="WhatsApp"
      >

      <span class="btn-label">
        Escribime acá!
      </span>

      <span
        class="btn-loading"
        aria-live="polite"
      >
        Cargando chat...
      </span>

    </a>

  </div>


  <!-- =====================================================
       JAVASCRIPT DEL BOTÓN
  ====================================================== -->

  <script>

    (function () {


      const btn =
        document.getElementById(
          'botonKommo'
        );


      if (!btn) {
        return;
      }


      btn.addEventListener(
        'click',
        function (e) {


          e.preventDefault();

          e.stopPropagation();


          console.log(
            'BOTON KOMMO CLICK'
          );


          /* ===============================================
             META PIXEL
          =============================================== */

          if (
            typeof fbq ===
            'function'
          ) {


            /*
             * Evento estándar:
             * la persona inició contacto.
             */

            fbq(
              'track',
              'Contact'
            );


            /*
             * Evento personalizado:
             * permite identificar específicamente
             * este botón en Events Manager.
             */

            fbq(
              'trackCustom',
              'ClickBotonKommo'
            );

          }


          /* ===============================================
             ABRIR KOMMO
          =============================================== */

          if (
            typeof crmPlugin ===
            'function'
          ) {


            console.log(
              'crmPlugin encontrado'
            );


            try {

              crmPlugin(
                'runChatShow'
              );


              console.log(
                'runChatShow ejecutado'
              );

            }
            catch (error) {

              console.log(
                'Error de Kommo:',
                error
              );

            }


          }
          else {


            console.log(
              'crmPlugin todavía no existe'
            );


            /*
             * Si Kommo tarda en cargar,
             * lo intentamos nuevamente.
             */

            setTimeout(
              function () {


                if (
                  typeof crmPlugin ===
                  'function'
                ) {

                  try {

                    crmPlugin(
                      'runChatShow'
                    );

                  }
                  catch (_) {}

                }

              },
              500
            );

          }

        }
      );


    })();

  </script>


</body>

</html>
