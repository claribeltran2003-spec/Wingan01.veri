<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GANAMOS - Bono de Regalo</title>

  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', '1993981097970015');
    fbq('track', 'PageView');
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #4a0080;
    }

    .wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
    }

    .promo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* Zona clickeable transparente encima del botón de la imagen */
    .hotspot {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 8%;
      width: 70%;
      max-width: 280px;
      height: 56px;
      border: none;
      background: transparent;
      cursor: pointer;
      z-index: 20;
      border-radius: 40px;
    }

    /* Por si querés un botón real encima (opcional) */
    .cta-real {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 7%;
      display: none; /* poné flex si querés que se vea un botón real */
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: #7B2CBF;
      color: white;
      font-size: 16px;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 40px;
      border: none;
      cursor: pointer;
      z-index: 21;
      box-shadow: 0 6px 20px rgba(0,0,0,0.35);
      width: 70%;
      max-width: 280px;
    }

    .cta-real img {
      width: 22px;
      height: 22px;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <!-- La imagen de la promo (tiene que estar en la misma carpeta) -->
    <img src="promo.jpeg" alt="Bono de Regalo" class="promo">

    <!-- Zona invisible clickeable sobre el botón de la imagen -->
    <button class="hotspot" id="btnChat" type="button" aria-label="Escribime"></button>
  </div>

  <!-- Kommo -->
  <script>
    (function(a,m,o,c,r,m){
      a[m]={
        id:"1078895",
        hash:"7afe8c661ae21b1eb55f38b542603609f977ea292469fbd2b5cb0cf03380b008",
        locale:"es",
        setMeta:function(p){this.params=(this.params||[]).concat([p])}
      };
      a[o]=a[o]||function(){(a[o].q=a[o].q||[]).push(arguments)};
      var d=a.document,s=d.createElement('script');
      s.async=true;
      s.id=m+'_script';
      s.src='https://gso.kommo.com/js/button.js';
      d.head&&d.head.appendChild(s)
    }(window,0,'crmPlugin',0,0,'crm_plugin'));
  </script>

  <script>
    setTimeout(function() {
      if (typeof fbq === 'function') fbq('track', 'Contact');
    }, 2500);

    function moverBotonKommo() {
      var btn = document.getElementById('crm_plugin_button');
      if (btn) {
        btn.style.position = 'fixed';
        btn.style.bottom = '-200px';
        btn.style.right = '-200px';
        btn.style.opacity = '0';
        btn.style.zIndex = '-1';
        btn.style.pointerEvents = 'auto';
      }
    }
    setInterval(moverBotonKommo, 400);

    function abrirChat() {
      try { if (typeof crmPlugin === 'function') crmPlugin('runChatShow'); } catch(e) {}
      var btn = document.getElementById('crm_plugin_button');
      if (btn) try { btn.click(); } catch(e) {}
      setTimeout(function() {
        try { crmPlugin('runChatShow'); } catch(e) {}
        if (btn) try { btn.click(); } catch(e) {}
      }, 500);
    }

    document.getElementById('btnChat').addEventListener('click', function(e) {
      e.preventDefault();
      abrirChat();
    });
  </script>

</body>
</html>
